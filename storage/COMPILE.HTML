<!doctype html>
<html><head><title>Compile</title></head><body>
<!-- Desktop program for Compile, same shape as NOTE.HTML.
     File → Open parks an HTML program in this window.
     The toolbox paints that source in the window. There is no
     black content box. While Save is compiling, the pointer is
     the Macintosh watch until the screen updates.
     File → Save compiles that program.
     File → Save As writes a new program, then compiles
     the new name. The program you opened stays as it was.
     COMPILER.HTML stays the hidden engine. Do not delete either file. -->
<canvas id="c" width="640" height="480"></canvas><script>
var ctx=document.getElementById("c").getContext("2d");
ctx.systemWindow=3;
// Role 3 uses the system Compiler title and About panel.
function tick(){requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></body></html>

    if (sx > 63) sx = 63;
    ctx.drawImage(IMG[T_WALL], sx, 0, 1, 64, x + shx, ds, 1, de - ds);
  }
}
function projectBill(o, dx, dy, px, py, po) {
  var e, det, inv, scale;
  e = o.m; if (!e) e = o.p;
  bb.e = e;
  bb.isMon = o.m ? 1 : 0;
  bb.tx = e.x - state.player.x;
  bb.ty = e.y - state.player.y;
  det = px * dy - dx * py;
  if (det === 0) { bb.tY = 0; return; }
  inv = 1 / det;
  bb.tX = inv * (dy * bb.tx - dx * bb.ty);
  bb.tY = inv * (-py * bb.tx + px * bb.ty);
  if (bb.tY < 0.15) return;
  bb.scrX = (W / 2) * (1 + bb.tX / bb.tY);
  bb.floorY = H / 2 + (H * 0.5) / bb.tY + po;
  scale = 0.45;
  if (bb.isMon) scale = e.boss ? 1.7 : 1.0;
  bb.sh = (H / bb.tY) * scale;
  bb.sw = bb.sh;
  bb.top = bb.floorY - bb.sh;
  bb.left = bb.scrX - bb.sw / 2;
}
function pickBillImg() {
  var e, atk;
  e = bb.e;
  if (bb.isMon) {
    atk = e.atk > 0 ? 1 : 0;
    if (e.boss) bb.img = atk ? IMG[B_ATK] : IMG[B_IDLE];
    else bb.img = atk ? IMG[M_ATK] : IMG[M_IDLE];
  } else {
    bb.img = e.type === "hp" ? IMG[P_HP] : IMG[P_AM];
  }
}
function blitBill() {
  var x, x0, x1, col, sxx;
  if (bb.tY < 0.15) return;
  x0 = Math.floor(bb.left); if (x0 < 0) x0 = 0;
  x1 = Math.floor(bb.left + bb.sw) + 1; if (x1 > W) x1 = W;
  for (x = x0; x < x1; x++) {
    if (bb.tY >= zget(x)) continue;
    col = (x - bb.left) / bb.sw;
    sxx = (col * 64) | 0;
    if (sxx < 0) sxx = 0;
    if (sxx > 63) sxx = 63;
    ctx.drawImage(bb.img, sxx, 0, 1, 64, x, bb.top, 1, bb.sh);
  }
}
function collectOrder(order) {
  var i, m, j, pk, tx, ty;
  for (i = 0; i < state.monsters.length; i++) {
    m = state.monsters[i];
    if (!m.alive) continue;
    tx = m.x - state.player.x; ty = m.y - state.player.y;
    order.push({m:m, p:null, d:tx * tx + ty * ty});
  }
  for (j = 0; j < state.pickups.length; j++) {
    pk = state.pickups[j];
    if (pk.got) continue;
    tx = pk.x - state.player.x; ty = pk.y - state.player.y;
    order.push({m:null, p:pk, d:tx * tx + ty * ty});
  }
  order.sort(function (a, b) { return b.d - a.d; });
}
function drawSprites(dx, dy, planeX, planeY, pitchOff) {
  var order, k;
  order = [];
  collectOrder(order);
  for (k = 0; k < order.length; k++) {
    projectBill(order[k], dx, dy, planeX, planeY, pitchOff);
    pickBillImg();
    blitBill();
  }
}
function drawGun() {
  var wimg, ww, wh;
  wimg = state.muzzle > 0 ? IMG[W_FIRE] : IMG[W_IDLE];
  ww = 220; wh = 220;
  ctx.drawImage(wimg, W / 2 - ww / 2, H - wh + 10, ww, wh);
  ctx.strokeStyle = "#00ff00";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(W / 2 - 8, H / 2); ctx.lineTo(W / 2 - 2, H / 2);
  ctx.moveTo(W / 2 + 2, H / 2); ctx.lineTo(W / 2 + 8, H / 2);
  ctx.moveTo(W / 2, H / 2 - 8); ctx.lineTo(W / 2, H / 2 - 2);
  ctx.moveTo(W / 2, H / 2 + 2); ctx.lineTo(W / 2, H / 2 + 8);
  ctx.stroke();
}
function drawHUD() {
  var left, i;
  ctx.fillStyle = "#000000";
  ctx.fillRect(0, H - 40, W, 40);
  ctx.fillStyle = "#ee3333";
  ctx.font = "16px monospace";
  ctx.fillText("HP " + state.player.hp, 16, H - 14);
  ctx.fillStyle = "#44ee44";
  ctx.fillText("AMMO " + state.player.ammo, 160, H - 14);
  ctx.fillStyle = "#eeee44";
  ctx.fillText("SCORE " + state.score, 340, H - 14);
  left = 0;
  for (i = 0; i < state.monsters.length; i++) if (state.monsters[i].alive) left = left + 1;
  ctx.fillStyle = "#ee99ee";
  ctx.fillText("FOES " + left, 500, H - 14);
}
function drawMinimap() {
  var s, mx, my, y, x, i, m, p;
  s = 4; mx = W - MW * s - 8; my = 8;
  ctx.fillStyle = "#000000";
  ctx.fillRect(mx - 2, my - 2, MW * s + 4, MH * s + 4);
  for (y = 0; y < MH; y++) {
    for (x = 0; x < MW; x++) {
      if (MAP[y][x] > 0) {
        ctx.fillStyle = "#555566";
        ctx.fillRect(mx + x * s, my + y * s, s, s);
      }
    }
  }
  for (i = 0; i < state.monsters.length; i++) {
    m = state.monsters[i];
    if (!m.alive) continue;
    ctx.fillStyle = m.boss ? "#ff00ff" : "#ff4444";
    ctx.fillRect(mx + m.x * s - 1, my + m.y * s - 1, 2, 2);
  }
  p = state.player;
  ctx.fillStyle = "#00ff00";
  ctx.fillRect(mx + p.x * s - 1, my + p.y * s - 1, 3, 3);
}
function drawCut(img, title, sub) {
  ctx.fillStyle = "#000000";
  ctx.fillRect(0, 0, W, H);
  ctx.drawImage(img, 0, 0, W, H);
  ctx.fillStyle = "#000000";
  ctx.fillRect(0, H / 2 - 40, W, 90);
  ctx.fillStyle = "#ffffff";
  ctx.font = "16px monospace";
  ctx.fillText(title, 180, H / 2);
  ctx.fillStyle = "#cccccc";
  ctx.fillText(sub, 180, H / 2 + 28);
}
function drawEnd(t1, t2) {
  ctx.fillStyle = "#000000";
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#ffffff";
  ctx.font = "16px monospace";
  ctx.fillText(t1, 200, H / 2 - 10);
  ctx.fillStyle = "#cccccc";
  ctx.fillText(t2, 80, H / 2 + 30);
}
function drawOverlay() {
  if (state.hurt > 0) {
    ctx.fillStyle = "#c80000";
    ctx.fillRect(0, 0, W, 8);
    ctx.fillRect(0, H - 48, W, 8);
  }
  if (state.phase === "intro") drawCut(IMG[C_INTRO], "THE HELLGATE OPENS", "SPACE TO ENTER");
  else if (state.phase === "boss") drawCut(IMG[C_BOSS], "THE BOSS AWAKENS", "SPACE TO FIGHT");
  else if (state.phase === "win") drawEnd("LEVEL CLEARED", "SCORE " + state.score + "  R RESTART");
  else if (state.phase === "dead") drawEnd("YOU DIED", "SCORE " + state.score + "  R RESTART");
}
function render() {
  var p, di, dx, dy, fov, planeX, planeY, pitchOff;
  p = state.player;
  di = fi(p.yaw); dx = LC[di]; dy = LS[di];
  fov = 0.66; planeX = -dy * fov; planeY = dx * fov;
  pitchOff = p.pitch * H * 0.6;
  fillBg(pitchOff);
  drawWalls(p, dx, dy, planeX, planeY, pitchOff);
  drawSprites(dx, dy, planeX, planeY, pitchOff);
  drawGun();
  drawHUD();
  drawMinimap();
  drawOverlay();
}
function frame() {
  frames = frames + 1;
  if (!state.over) update();
  render();
  requestAnimationFrame(frame);
}

addEventListener("keydown", kd, false);
addEventListener("keyup", ku, false);
addEventListener("blur", clearKeys, false);
fillLut();
loadSpr();
reset();
requestAnimationFrame(frame);
</script>
<script data-host="chrome">
(function () {
  var cvs = document.getElementById("c");
  cvs.addEventListener("click", function () {
    if (document.pointerLockElement !== cvs) cvs.requestPointerLock();
    if (window.game) { window.game.skip(); }
  }, false);
  addEventListener("mousemove", function (e) {
    var p, lim;
    if (document.pointerLockElement !== cvs) return;
    if (!window.state) return;
    p = window.state.player;
    p.yaw -= e.movementX * 0.0025;
    p.pitch -= e.movementY * 0.0025;
    lim = Math.PI / 2 - 0.05;
    if (p.pitch > lim) p.pitch = lim;
    if (p.pitch < -lim) p.pitch = -lim;
  }, false);
  var ctx = null, noise = null;
  function ac() {
    var AC, i, d;
    if (ctx) return ctx;
    AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    d = noise.getChannelData(0);
    for (i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return ctx;
  }
  window._chromePlay = function (r) {
    var a, i, freq, vol, frames, slide, ch, dur, t0, osc, g;
    a = ac();
    if (!a || !r || !r.length) return;
    if (a.state === "suspended") a.resume();
    t0 = a.currentTime;
    for (i = 0; i + 4 < r.length; i = i + 5) {
      freq = r[i]; vol = r[i + 1]; frames = r[i + 2]; slide = r[i + 3]; ch = r[i + 4];
      if (vol <= 0 || frames <= 0) continue;
      dur = frames / 60;
      if (dur < 0.02) dur = 0.02;
      g = a.createGain();
      g.gain.setValueAtTime((vol / 15) * 0.1, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      g.connect(a.destination);
      if (ch === 3) {
        osc = a.createBufferSource();
        osc.buffer = noise;
        osc.loop = true;
      } else {
        osc = a.createOscillator();
        osc.type = "square";
        osc.frequency.setValueAtTime(Math.max(20, freq), t0);
        if (slide) osc.frequency.linearRampToValueAtTime(Math.max(20, freq + slide * frames), t0 + dur);
      }
      osc.connect(g);
      osc.start(t0);
      osc.stop(t0 + dur);
    }
  };
})();
</script>

/* PACMAN2: JSON-free map ops (V1 silicon diet — JSON engine removal).
   Values in map cells are single digits 0-6, so these loops are exact
   equivalents of the JSON round-trips they replace. */
function _copyMap(src){var out=[];for(var j=0;j<src.length;j++){var row=src[j],r=[];for(var i=0;i<row.length;i++){r.push(row[i]);}out.push(r);}return out;}
function _mapHasZero(src){for(var j=0;j<src.length;j++){var row=src[j];for(var i=0;i<row.length;i++){if(row[i]===0)return true;}}return false;}
function _isPower(list,x,y){
    var n=0;
    while(n<list.length){
        if(list[n][0]===x&&list[n][1]===y) return 1;
        n=n+1;
    }
    return 0;
}
var _c2p={x:0,y:0};
// BOARD #84: chase/flee are one-step only (same shape as MRDO creepToward).
// Door/house 2 is walkable. On a 2, prefer smaller y then column 13 (the
// door) — greedy-toward-player goes down and they never leave.
// No maze clone, no finder, no Array.fill/map. Iterative flood on every
// ghost every cell still froze HDMI (~15 dots). Eyes home is _ghostHome
// once per tile. Original flood is PACORIG.HTML.
var _gs={x:0,y:0,ok:0,change:0};
var _g1=0;
function _ghostOpen(data,x,y){
    var yl,v;
    yl=data.length;
    if(y<0||y>=yl||x<0||x>=data[0].length) return 0;
    v=data[y][x];
    return (v<1||v==2)?1:0;
}
// mode 0 = chase / eyes home, 1 = flee, 2 = chase + leave-house.
// while + d=d+1 (not for/d++). ≤16 env slots — extra names become GLOBAL
// and a for(d++) that does not increment never leaves rAF (#84).
function _ghostStep(data,sx,sy,ex,ey,mode){
    var d,nx,ny,dist,bestD,yl;
    _gs.ok=0; _gs.change=0;
    yl=data.length;
    if(data[sy]&&data[sy][sx]==2&&mode==2){
        bestD=9999;
        d=0;
        while(d<4){
            nx=sx+(d==0?1:d==2?-1:0);
            ny=sy+(d==1?1:d==3?-1:0);
            if(ny<0||ny>=yl||nx<0||nx>=data[0].length){
                nx=(nx+data[0].length)%data[0].length; ny=(ny+yl)%yl;
            }
            if(_ghostOpen(data,nx,ny)){
                dist = ny*100+(nx>13?nx-13:13-nx);
                if(dist<bestD){
                    bestD=dist; _gs.x=nx; _gs.y=ny; _gs.ok=1;
                    _gs.change=(nx-sx>1||sx-nx>1||ny-sy>1||sy-ny>1)?1:0;
                }
            }
            d=d+1;
        }
        return _gs;
    }
    if(mode==1) bestD=-1; else bestD=9999;
    d=0;
    while(d<4){
        nx=sx+(d==0?1:d==2?-1:0);
        ny=sy+(d==1?1:d==3?-1:0);
        if(ny<0||ny>=yl||nx<0||nx>=data[0].length){
            nx=(nx+data[0].length)%data[0].length; ny=(ny+yl)%yl;
        }
        if(_ghostOpen(data,nx,ny)){
            dist=(nx>ex?nx-ex:ex-nx)+(ny>ey?ny-ey:ey-ny);
            if(mode==1){
                if(dist>bestD){
                    bestD=dist; _gs.x=nx; _gs.y=ny; _gs.ok=1;
                    _gs.change=(nx-sx>1||sx-nx>1||ny-sy>1||sy-ny>1)?1:0;
                }
            }else if(dist<bestD){
                bestD=dist; _gs.x=nx; _gs.y=ny; _gs.ok=1;
                _gs.change=(nx-sx>1||sx-nx>1||ny-sy>1||sy-ny>1)?1:0;
            }
        }
        d=d+1;
    }
    if(!_gs.ok){
        d=0;
        while(d<4){
            nx=sx+(d==0?1:d==2?-1:0);
            ny=sy+(d==1?1:d==3?-1:0);
            if(ny<0||ny>=yl||nx<0||nx>=data[0].length){
                nx=(nx+data[0].length)%data[0].length; ny=(ny+yl)%yl;
            }
            if(_ghostOpen(data,nx,ny)){
                _gs.x=nx; _gs.y=ny; _gs.ok=1;
                _gs.change=(nx-sx>1||sx-nx>1||ny-sy>1||sy-ny>1)?1:0;
                d=4;
            }else d=d+1;
        }
    }
    return _gs;
}
// Eyes home only. Shortest path on the EXISTING map (door/house 2 is open).
// Do NOT restore Map.finder / _copyMapOpen — that clones 31 row-arrays plus
// start/end/options (~36 objects) before the walk, then more per push.
// PACMAN already holds ~676 of MAX_OBJ=960; one finder call can fault 3.
// Chase may call this ONCE per frame (_g1), not every ghost every cell.
// Do NOT restore finder / every-tick flood (#84). Marks visited as orig+10
// then restores. Queue is numbers in one reused array (cap 128), not a grid.
var _eh={qh:0,qt:0,x:0,y:0,d:0,nx:0,ny:0,v:0,xl:0,yl:0};
var _eyeQ=[];
function _ghostHome(data,sx,sy,ex,ey){
    _gs.ok=0; _gs.change=0;
    _eh.yl=data.length;
    _eh.xl=data[0].length;
    if(!_ghostOpen(data,sx,sy)) return _gs;
    if(!_ghostOpen(data,ex,ey)) return _gs;
    _eh.qh=0; _eh.qt=0;
    _eyeQ[0]=ey*100+ex;
    _eh.qt=1;
    data[ey][ex]=data[ey][ex]+10;
    while(_eh.qh<_eh.qt){
        _eh.v=_eyeQ[_eh.qh%128];
        _eh.qh=_eh.qh+1;
        _eh.x=_eh.v%100;
        _eh.y=Math.floor(_eh.v/100);
        _eh.d=0;
        while(_eh.d<4){
            _eh.nx=_eh.x+(_eh.d==0?1:_eh.d==2?-1:0);
            _eh.ny=_eh.y+(_eh.d==1?1:_eh.d==3?-1:0);
            if(_eh.ny<0||_eh.ny>=_eh.yl||_eh.nx<0||_eh.nx>=_eh.xl){
                _eh.nx=(_eh.nx+_eh.xl)%_eh.xl;
                _eh.ny=(_eh.ny+_eh.yl)%_eh.yl;
            }
            if(_eh.nx==sx&&_eh.ny==sy){
                _gs.x=_eh.x; _gs.y=_eh.y; _gs.ok=1;
                _gs.change=(_gs.x-sx>1||sx-_gs.x>1||_gs.y-sy>1||sy-_gs.y>1)?1:0;
                _eh.d=4;
                _eh.qh=_eh.qt;
            }else if(_ghostOpen(data,_eh.nx,_eh.ny)){
                data[_eh.ny][_eh.nx]=data[_eh.ny][_eh.nx]+10;
                if(_eh.qt-_eh.qh>=128){
                    _eh.d=4; _eh.qh=_eh.qt;
                }else{
                    _eyeQ[_eh.qt%128]=_eh.ny*100+_eh.nx;
                    _eh.qt=_eh.qt+1;
                }
            }
            if(_eh.d<4) _eh.d=_eh.d+1;
        }
    }
    _eh.y=0;
    while(_eh.y<_eh.yl){
        _eh.x=0;
        while(_eh.x<_eh.xl){
            _eh.v=data[_eh.y][_eh.x];
            if(_eh.v>=10) data[_eh.y][_eh.x]=_eh.v%10;
            _eh.x=_eh.x+1;
        }
        _eh.y=_eh.y+1;
    }
    return _gs;
}

function Game(id,params){
    var _ = this;
    var settings = {
        width:640,						// NEW: JMR glass
        height:480
    };
    Object.assign(_,settings,params);
    var $canvas = document.getElementById(id);
    $canvas.width = _.width;
    $canvas.height = _.height;
    var _context = $canvas.getContext('2d');	//画布上下文环境
    var _stages = [];							//布景对象队列
    var _events = {};							//事件集合
    var _index=0,								//当前布景索引
        _hander,  								//帧动画控制
        _joyFireWas=0;							// NEW: stick FIRE edge (title / pause / restart)
    //活动对象构造
    var Item = function(params){
        this._params = params||{};
        this._id = 0;               //标志符
        this._stage = null;         //与所属布景绑定
        this._settings = {
            x:0,					//位置坐标:横坐标
            y:0,					//位置坐标:纵坐标
            width:20,				//宽
            height:20,				//高
            type:0,					//对象类型,0表示普通对象(不与地图绑定),1表示玩家控制对象,2表示程序控制对象
            color:'#F00',			//标识颜色
            status:1,				//对象状态,0表示未激活/结束,1表示正常,2表示暂停,3表示临时,4表示异常
            orientation:0,			//当前定位方向,0表示右,1表示下,2表示左,3表示上
            speed:0,				//移动速度
            //地图相关
            location:null,			//定位地图,Map对象
            coord:null,				//如果对象与地图绑定,需设置地图坐标;若不绑定,则设置位置坐标
            path:[],				//NPC自动行走的路径
            vector:null,			//目标坐标
            //布局相关
            frames:1,				//速度等级,内部计算器times多少帧变化一次
            times:0,				//刷新画布计数(用于循环动画状态判断)
            timeout:0,				//倒计时(用于过程动画状态判断)
            control:{},				//控制缓存,到达定位点时处理
            update:function(){}, 	//更新参数信息
            draw:function(){}		//绘制
        };
        Object.assign(this,this._settings,this._params);
    };
    Item.prototype.bind = function(eventType,callback){
        if(!_events[eventType]){
            _events[eventType] = {};
            $canvas.addEventListener(eventType,function(e){
                var position = _.getPosition(e);
                _stages[_index].items.forEach(function(item){
                    if(item.x<=position.x&&position.x<=item.x+item.width&&item.y<=position.y&&position.y<=item.y+item.height){
                        var key = 's'+_index+'i'+item._id;
                        if(_events[eventType][key]){
                            _events[eventType][key](e);
                        }
                    }
                });
                e.preventDefault();
            });
        }
        _events[eventType]['s'+this._stage.index+'i'+this._id] = callback.bind(this);  //绑定作用域
    };
    //地图对象构造器
    var Map = function(params){
        this._params = params||{};
        this._id = 0;               //标志符
        this._stage = null;         //与所属布景绑定
        this._settings = {
            x:0,					//地图起点坐标
            y:0,
            size:14,				// NEW: 28*14=392 fits 640 with HUD
            data:[],				//地图数据
            x_length:0,				//二维数组x轴长度
            y_length:0,				//二维数组y轴长度
            frames:1,				//速度等级,内部计算器times多少帧变化一次
            times:0,				//刷新画布计数(用于循环动画状态判断)
            cache:false,    		//是否静态（如静态则设置缓存）
            update:function(){},	//更新地图数据
            draw:function(){},		//绘制地图
        };
        Object.assign(this,this._settings,this._params);
    };
    //获取地图上某点的值
    Map.prototype.get = function(x,y){
        if(this.data[y]&&typeof this.data[y][x]!='undefined'){
            return this.data[y][x];
        }
        return -1;
    };
    //设置地图上某点的值 — FAST: beans eat inlines data[y][x]=1 (CODE_WORDS).
    //地图坐标转画布坐标
    Map.prototype.coord2position = function(cx,cy){
        _c2p.x=this.x+cx*this.size+this.size/2;
        _c2p.y=this.y+cy*this.size+this.size/2;
        return _c2p;
    };
    //画布坐标转地图坐标
    Map.prototype.position2coord = function(x,y){
        var fx = Math.abs(x-this.x)%this.size-this.size/2;
        var fy = Math.abs(y-this.y)%this.size-this.size/2;
        return {
            x:Math.floor((x-this.x)/this.size),
            y:Math.floor((y-this.y)/this.size),
            offset:Math.sqrt(fx*fx+fy*fy)
        };
    };
    //寻址算法 — empty. Ghosts call _ghostStep directly. Original BFS is PACORIG.HTML.
    // A/B: return [] here → board did not freeze. Do not put a maze walk back.
    // FAST: omit Map.finder stub (dead; CODE_WORDS).
    //布景对象构造器
    var Stage = function(params){
        this._params = params||{};
        this._settings = {
            index:0,                        //布景索引
            status:0,						//布景状态,0表示未激活/结束,1表示正常,2表示暂停,3表示临时状态
            maps:[],						//地图队列
            audio:[],						//音频资源
            images:[],						//图片资源
            items:[],						//对象队列
            timeout:0,						//倒计时(用于过程动画状态判断)
            update:function(){}				//嗅探,处理布局下不同对象的相对关系
        };
        Object.assign(this,this._settings,this._params);
    };
    //添加对象
    Stage.prototype.createItem = function(options){
        var item = new Item(options);
        //动态属性
        if(item.location){
            Object.assign(item,item.location.coord2position(item.coord.x,item.coord.y));
        }
        //关系绑定
        item._stage = this;
        item._id = this.items.length;
        this.items.push(item);
        return item;
    };
    //重置物体位置
    Stage.prototype.resetItems = function(){
        this.status = 1;
        this.items.forEach(function(item,index){
            Object.assign(item,item._settings,item._params);
            if(item.location){
                Object.assign(item,item.location.coord2position(item.coord.x,item.coord.y));
            }
        });
    };
    //获取对象列表
    Stage.prototype.getItemsByType = function(type){
        return this.items.filter(function(item){
	    return item.type == type;
        });
    };
    //添加地图
    Stage.prototype.createMap = function(options){
        var map = new Map(options);
        //动态属性
        map.data = _copyMap(map._params.data);
        map.y_length = map.data.length;
        map.x_length = map.data[0].length;
        map.imageData = null;
        //关系绑定
        map._stage = this;
        map._id = this.maps.length;
        this.maps.push(map);
        return map;
    };
    //重置地图
    Stage.prototype.resetMaps = function(){
        this.status = 1;
        this.maps.forEach(function(map){
            Object.assign(map,map._settings,map._params);
            map.data = _copyMap(map._params.data);
            map.y_length = map.data.length;
            map.x_length = map.data[0].length;
            map.imageData = null;
        });
    };
    //重置
    Stage.prototype.reset = function(){
        Object.assign(this,this._settings,this._params);
        this.resetItems();
        this.resetMaps();
    };
    //绑定事件
    Stage.prototype.bind = function(eventType,callback){
        if(!_events[eventType]){
            _events[eventType] = {};
            window.addEventListener(eventType,function(e){
                var key = 's' + _index;
                if(_events[eventType][key]){
                    _events[eventType][key](e);
                }
                e.preventDefault();
            });
        }
        _events[eventType]['s'+this.index] = callback.bind(this);	//绑定事件作用域
    };
    //动画开始
    this.start = function() {
        var f = 0;		//帧数计算
        var fn = function(){
            /* FAST: rAF is the frame clock on this machine. new Date() every
               tick was wasted JS and capped Chrome; FPGA is not 144 Hz. */
            var stage = _stages[_index];
            var mi, ii, map, item;
            // NEW: Pmod stick FIRE1/FIRE2 → Enter (title start, pause, game-over)
            var sj = 0;
            try { sj = joy() | 0; } catch (je) { sj = 0; }
            var fireOn = (sj & 16) || (sj & 32);
            if (fireOn && !_joyFireWas) {
                var kd = _events['keydown'];
                var cb = kd && kd['s' + _index];
                if (cb) cb({keyCode: 13, key: 'Enter'});
            }
            _joyFireWas = fireOn ? 1 : 0;
            /* FAST: skip full wipe when maze ImageData will restore the
               playfield — same as PACMAN. Maze is cached once; beans redraw
               every frame so pellets stay PACMAN (arcs + pulse). */
            if(!stage.maps.length || !stage.maps[0].imageData){
            _context.clearRect(0,0,_.width,_.height);		//清除画布
            _context.fillStyle = '#000000';
            _context.fillRect(0,0,_.width,_.height);
            }
            f++;
            if(stage.timeout){
                stage.timeout--;
            }
            if(stage.update()!=false){		            //update返回false,则不绘制
                for(mi=0;mi<stage.maps.length;mi++){
                    map=stage.maps[mi];
                    if(!(f%map.frames)){
                        map.times = f/map.frames;		//计数器
                    }
                    if(map.cache){
                        if(map.imageData){
                            _context.putImageData(map.imageData,0,0);
                        }else{
                            map.draw(_context);
                        }
                    }else{
                    	map.update();
                        map.draw(_context);
                    }
                }
                /* FAST: snapshot maze AFTER beans stamp regulars (not 300 fillRect every frame). */
                if(stage.maps.length&&stage.maps[0].cache&&!stage.maps[0].imageData){
                    stage.maps[0].imageData = _context.getImageData(0,0,_.width,_.height);
                }
                for(ii=0;ii<stage.items.length;ii++){
                    item=stage.items[ii];
                    if(!(f%item.frames)){
                        item.times = f/item.frames;		   //计数器
                    }
                    if(stage.status==1&&item.status!=2){  	//对象及布景状态都不处于暂停状态
                        if(item.location){
                            item.coord = item.location.position2coord(item.x,item.y);
                        }
                        if(item.timeout){
                            item.timeout--;
                        }
                        item.update();
                    }
                    item.draw(_context);
                }
            }
            _hander = requestAnimationFrame(fn);
        };
        _hander = requestAnimationFrame(fn);
    };
    //动画结束
    this.stop = function(){
        _hander&&cancelAnimationFrame(_hander);
    };
    //事件坐标
    this.getPosition = function(e){
        var box = $canvas.getBoundingClientRect();
        return {
            x:e.clientX-box.left*(_.width/box.width),
            y:e.clientY-box.top*(_.height/box.height)
        };
    }
    //创建布景
    this.createStage = function(options){
        var stage = new Stage(options);
        stage.index = _stages.length;
        _stages.push(stage);
        return stage;
    };
    //指定布景
    this.setStage = function(index){
        _stages[_index].status = 0;
        _index = index;
        _stages[_index].status = 1;
        _stages[_index].reset(); //重置
        return _stages[_index];
    };
    //下个布景
    this.nextStage = function(){
        if(_index<_stages.length-1){
            return this.setStage(++_index);
        }else{
            throw new Error('unfound new stage.');
        }
    };
    //获取布景列表
    this.getStages = function(){
        return _stages;
    };
    //初始化游戏引擎
    this.init = function(){
        _index = 0;
        this.start();
    };
}

							if(map&&!map.get(item.coord.x,item.coord.y)&&!map.get(player.coord.x,player.coord.y)){
								var dx = item.x-player.x;
								var dy = item.y-player.y;
								if(dx*dx+dy*dy<368&&item.status!=4){		// NEW: hit radius *(14/20)^2
									if(item.status==3){
										item.status = 4;
										_SCORE += 10;
									}else{
										stage.status = 3;
										stage.timeout = 30;
									}
								}
							}
						}
						if(!_mapHasZero(beans.data)){	//当没有物品的时候，进入下一关
							game.nextStage();
						}
					}else if(stage.status==3){		//场景临时状态
						if(!stage.timeout){
							_LIFE--;
							if(_LIFE){
								stage.resetItems();
							}else{
								var stages = game.getStages();
								game.setStage(stages.length-1);
								return false;
							}
						}
					}
				}
			});
			//绘制地图
			map = stage.createMap({
				x:16,
				y:8,
				data:config['map'],
				cache:true,
				draw:function(context){
					/* Same walls as PACMAN. Cached once into maze ImageData. */
					context.lineWidth = 2;
					for(var j=0; j<this.y_length; j++){
						for(var i=0; i<this.x_length; i++){
							var value = this.get(i,j);
							if(value){
								var code = [0,0,0,0];
								if(this.get(i+1,j)&&!(this.get(i+1,j-1)&&this.get(i+1,j+1)&&this.get(i,j-1)&&this.get(i,j+1))){
									code[0]=1;
								}
								if(this.get(i,j+1)&&!(this.get(i-1,j+1)&&this.get(i+1,j+1)&&this.get(i-1,j)&&this.get(i+1,j))){
									code[1]=1;
								}
								if(this.get(i-1,j)&&!(this.get(i-1,j-1)&&this.get(i-1,j+1)&&this.get(i,j-1)&&this.get(i,j+1))){
									code[2]=1;
								}
								if(this.get(i,j-1)&&!(this.get(i-1,j-1)&&this.get(i+1,j-1)&&this.get(i-1,j)&&this.get(i+1,j))){
									code[3]=1;
								}
								if(code.indexOf(1)>-1){
									context.strokeStyle=value==2?"#FFF":config['wall_color'];
									var pos = this.coord2position(i,j);
									switch(code.join('')){
										case '1100':
											context.beginPath();
											context.arc(pos.x+this.size/2,pos.y+this.size/2,this.size/2,Math.PI,1.5*Math.PI,false);
											context.stroke();
											context.closePath();
											break;
										case '0110':
											context.beginPath();
											context.arc(pos.x-this.size/2,pos.y+this.size/2,this.size/2,1.5*Math.PI,2*Math.PI,false);
											context.stroke();
											context.closePath();
											break;
										case '0011':
											context.beginPath();
											context.arc(pos.x-this.size/2,pos.y-this.size/2,this.size/2,0,.5*Math.PI,false);
											context.stroke();
											context.closePath();
											break;
										case '1001':
											context.beginPath();
											context.arc(pos.x+this.size/2,pos.y-this.size/2,this.size/2,.5*Math.PI,1*Math.PI,false);
											context.stroke();
											context.closePath();
											break;
										default:
											var dist = this.size/2;
											code.forEach(function(v,index){
												if(v){
													context.beginPath();
													context.moveTo(pos.x,pos.y);
													context.lineTo(pos.x-_COS[index]*dist,pos.y-_SIN[index]*dist);
													context.stroke();
													context.closePath();
												}
											});
									}
								}
							}
						}
					}
				}
			});
			//物品地图
			beans = stage.createMap({
				x:16,
				y:8,
				data:config['map'],
				frames:8,
				draw:function(context){
					/* Same pellets as PACMAN. Regulars bake into maze ImageData once. */
					var j,i,v,baked;
					baked=stage.maps[0].imageData;
					for(j=0;j<this.y_length;j++){
						for(i=0;i<this.x_length;i++){
							v=this.data[j][i];
							if(!v){
								if(_isPower(config['goods'],i,j)){
									if(baked){
										this.coord2position(i,j);
										context.fillStyle="#F5F5DC";
										context.beginPath();
										context.arc(_c2p.x,_c2p.y,3+this.times%2,0,2*Math.PI,true);
										context.fill();
										context.closePath();
									}
								}else if(!baked){
									this.coord2position(i,j);
									context.fillStyle="#F5F5DC";
									context.fillRect(_c2p.x-2,_c2p.y-2,4,4);
								}
							}else if(v===3){
								this.coord2position(i,j);
								context.fillStyle="#000000";
								context.fillRect(_c2p.x-2,_c2p.y-2,4,4);
							}
						}
					}
				}
			});
			//关卡得分
			stage.createItem({
				x:420,
				y:80,
				draw:function(context){
					context.font = 'bold 24px PressStart2P';
					context.textAlign = 'left';
					context.textBaseline = 'bottom';
					context.fillStyle = '#C33';
					context.fillText('SCORE',this.x,this.y);
					context.font = '24px PressStart2P';
					context.textAlign = 'left';
					context.textBaseline = 'top';
					context.fillStyle = '#FFF';
					context.fillText(_SCORE,this.x+12,this.y+10);
					context.font = 'bold 24px PressStart2P';
					context.textAlign = 'left';
					context.textBaseline = 'bottom';
					context.fillStyle = '#C33';
					context.fillText('LEVEL',this.x,this.y+72);
					context.font = '24px PressStart2P';
					context.textAlign = 'left';
					context.textBaseline = 'top';
					context.fillStyle = '#FFF';
					context.fillText(index+1,this.x+12,this.y+82);
				}
			});
			//状态文字
			stage.createItem({
				x:420,
				y:285,
				frames:25,
				draw:function(context){
					if(stage.status==2&&this.times%2){
						context.font = '24px PressStart2P';
						context.textAlign = 'left';
						context.textBaseline = 'center';
						context.fillStyle = '#FFF';
						context.fillText('PAUSE',this.x,this.y);
					}
				}
			});
			//生命值
			stage.createItem({
				x:430,
				y:400,
				width:30,
				height:30,
				draw:function(context){
					var max = Math.min(_LIFE-1,5);
					for(var i=0;i<max;i++){
						var x=this.x+40*i,y=this.y;
						context.fillStyle = '#FFE600';
						context.beginPath();
						context.arc(x,y,this.width/2,.15*Math.PI,-.15*Math.PI,false);
						context.lineTo(x,y);
						context.closePath();
						context.fill();
					}
					context.font = '18px PressStart2P';
					context.textAlign = 'left';
					context.textBaseline = 'center';
					context.fillStyle = '#FFF';
					context.fillText('X',this.x-15,this.y+30);
					context.font = '24px PressStart2P';
					context.fillText((_LIFE-1),this.x+10,this.y+26);
				}
			});
			//NPC
			for(var i=0;i<4;i++){
				stage.createItem({
					// NEW: 21 = 30*(14/20) to match size:14 tiles
					width:21,
					height:21,
					orientation:3,
					color:_COLOR[i],
					location:map,
					coord:{x:12+i,y:14},
					vector:{x:12+i,y:14},
					type:2,
					frames:10,
					speed:1,
					timeout:Math.floor(Math.random()*120),
					update:function(){
						if(this.status==3&&!this.timeout){
							this.status = 1;
						}
						if(!this.coord.offset){			//到达坐标中心时计算
							if(this.status==1){
								if(!this.timeout){		//定时器
									if(!_g1){
										_ghostHome(map.data,this.coord.x,this.coord.y,player.coord.x,player.coord.y);
										_g1=1;
										if(!_gs.ok) _ghostStep(map.data,this.coord.x,this.coord.y,player.coord.x,player.coord.y,2);
									}else{
										_ghostStep(map.data,this.coord.x,this.coord.y,player.coord.x,player.coord.y,2);
									}
									if(_gs.ok){ this.vector.x=_gs.x; this.vector.y=_gs.y; this.vector.change=_gs.change; }
								}
							}else if(this.status==3){
								_ghostStep(map.data,this.coord.x,this.coord.y,player.coord.x,player.coord.y,1);
								if(_gs.ok){ this.vector.x=_gs.x; this.vector.y=_gs.y; this.vector.change=_gs.change; }
							}else if(this.status==4){
								if(this.coord.x==this._params.coord.x&&this.coord.y==this._params.coord.y){
									this.status = 1;
								}else{
									// Eyes: in-place BFS to spawn. Not finder (heap). Not every-tick chase.
									_ghostHome(map.data,this.coord.x,this.coord.y,this._params.coord.x,this._params.coord.y);
									if(!_gs.ok) _ghostStep(map.data,this.coord.x,this.coord.y,this._params.coord.x,this._params.coord.y,0);
									if(_gs.ok){ this.vector.x=_gs.x; this.vector.y=_gs.y; this.vector.change=_gs.change; }
								}
							}
							//是否转变方向
							if(this.vector.change){
								this.coord.x = this.vector.x;
								this.coord.y = this.vector.y;
								var pos = map.coord2position(this.coord.x,this.coord.y);
								this.x = pos.x;
								this.y = pos.y;
							}
							//方向判定
							if(this.vector.x>this.coord.x){
								this.orientation = 0;
							}else if(this.vector.x<this.coord.x){
								this.orientation = 2;
							}else if(this.vector.y>this.coord.y){
								this.orientation = 1;
							}else if(this.vector.y<this.coord.y){
								this.orientation = 3;
							}
						}
						this.x += this.speed*_COS[this.orientation];
						this.y += this.speed*_SIN[this.orientation];
					},
					draw:function(context){
						var isSick = false;
						if(this.status==3){
							isSick = this.timeout>80||this.times%2?true:false;
						}
						if(this.status!=4){
							context.fillStyle = isSick?'#BABABA':this.color;
							context.beginPath();
							context.arc(this.x,this.y,this.width*.5,0,Math.PI,true);
							switch(this.times%2){
								case 0:
								context.lineTo(this.x-this.width*.5,this.y+this.height*.4);
								context.quadraticCurveTo(this.x-this.width*.4,this.y+this.height*.5,this.x-this.width*.2,this.y+this.height*.3);
								context.quadraticCurveTo(this.x,this.y+this.height*.5,this.x+this.width*.2,this.y+this.height*.3);
								context.quadraticCurveTo(this.x+this.width*.4,this.y+this.height*.5,this.x+this.width*.5,this.y+this.height*.4);
								break;
								case 1:
								context.lineTo(this.x-this.width*.5,this.y+this.height*.3);
								context.quadraticCurveTo(this.x-this.width*.25,this.y+this.height*.5,this.x,this.y+this.height*.3);
								context.quadraticCurveTo(this.x+this.width*.25,this.y+this.height*.5,this.x+this.width*.5,this.y+this.height*.3);
								break;
							}
							context.fill();
							context.closePath();
						}
						context.fillStyle = '#FFF';
						if(isSick){
							context.beginPath();
							context.arc(this.x-this.width*.15,this.y-this.height*.21,this.width*.08,0,2*Math.PI,false);
							context.arc(this.x+this.width*.15,this.y-this.height*.21,this.width*.08,0,2*Math.PI,false);
							context.fill();
							context.closePath();
						}else{
							context.beginPath();
							context.arc(this.x-this.width*.15,this.y-this.height*.21,this.width*.12,0,2*Math.PI,false);
							context.arc(this.x+this.width*.15,this.y-this.height*.21,this.width*.12,0,2*Math.PI,false);
							context.fill();
							context.closePath();
							context.fillStyle = '#000';
							context.beginPath();
							context.arc(this.x-this.width*(.15-.04*_COS[this.orientation]),this.y-this.height*(.21-.04*_SIN[this.orientation]),this.width*.07,0,2*Math.PI,false);
							context.arc(this.x+this.width*(.15+.04*_COS[this.orientation]),this.y-this.height*(.21-.04*_SIN[this.orientation]),this.width*.07,0,2*Math.PI,false);
							context.fill();
							context.closePath();
						}
					}
				});
			}
			items = stage.getItemsByType(2);
			//主角
			player = stage.createItem({
				// NEW: integer cell center (13.5 + size 14 never hit offset==0)
				width:21,
				height:21,
				type:1,
				location:map,
				coord:{x:13,y:23},
				orientation:2,
				speed:2,
				frames:10,
				update:function(){
					var coord = this.coord;
					if(!coord.offset){
						if(this.control.orientation>=0){
							if(!map.get(coord.x+_COS[this.control.orientation],coord.y+_SIN[this.control.orientation])){
								this.orientation = this.control.orientation;
							}
						}
						this.control.orientation = -1;
						var value = map.get(coord.x+_COS[this.orientation],coord.y+_SIN[this.orientation]);
						if(value==0){
							this.x += this.speed*_COS[this.orientation];
							this.y += this.speed*_SIN[this.orientation];
						}else if(value<0){
							this.x -= map.size*(map.x_length-1)*_COS[this.orientation];
							this.y -= map.size*(map.y_length-1)*_SIN[this.orientation];
						}
					}else{
						if(!beans.get(this.coord.x,this.coord.y)){	//吃豆
							_SCORE++;
							beans.data[this.coord.y][this.coord.x]=3;
							if(_isPower(config['goods'], this.coord.x, this.coord.y)){	//吃到能量豆
								var fi, gh;
								for(fi=0;fi<items.length;fi++){
									gh=items[fi];
									if(gh.status==1||gh.status==3){	//如果NPC为正常状态，则置为临时状态
										gh.timeout = 450;
										gh.status = 3;
									}
								}
							}
						}
						this.x += this.speed*_COS[this.orientation];
						this.y += this.speed*_SIN[this.orientation];
					}
				},
				draw:function(context){
					context.fillStyle = '#FFE600';
					context.beginPath();
					if(stage.status!=3){	//玩家正常状态
						if(this.times%2){
							context.arc(this.x,this.y,this.width/2,(.5*this.orientation+.20)*Math.PI,(.5*this.orientation-.20)*Math.PI,false);
						}else{
							context.arc(this.x,this.y,this.width/2,(.5*this.orientation+.01)*Math.PI,(.5*this.orientation-.01)*Math.PI,false);
						}
					}else{	//玩家被吃
						if(stage.timeout) {
							context.arc(this.x,this.y,this.width/2,(.5*this.orientation+1-.02*stage.timeout)*Math.PI,(.5*this.orientation-1+.02*stage.timeout)*Math.PI,false);
						}
					}
					context.lineTo(this.x,this.y);
					context.closePath();
					context.fill();
				}
			});
			/* FAST: own control object (do not share Item _settings.control). */
			player.control = {orientation:-1};
			//事件绑定
			stage.bind('keydown',function(e){
				switch(e.keyCode){
					case 13: //回车
					case 32: //空格
					this.status = this.status==2?1:2;
					break;
					case 39: //右
					player.control.orientation = 0;
					break;
					case 40: //下
					player.control.orientation = 1;
					break;
					case 37: //左
					player.control.orientation = 2;
					break;
					case 38: //上
					player.control.orientation = 3;
					break;
				}
			});
		});
	})();
	//结束画面
	(function(){
		var stage = game.createStage();
		//游戏结束
		stage.createItem({
			x:game.width/2,
			y:game.height*.35,
			draw:function(context){
				context.fillStyle = '#FFF';
				context.font = 'bold 48px PressStart2P';
				context.textAlign = 'center';
				context.textBaseline = 'middle';
				context.fillText(_LIFE?'YOU WIN!':'GAME OVER',this.x,this.y);
			}
		});
		//记分
		stage.createItem({
			x:game.width/2,
			y:game.height*.5,
			draw:function(context){
				context.fillStyle = '#FFF';
				context.font = '20px PressStart2P';
				context.textAlign = 'center';
				context.textBaseline = 'middle';
				context.fillText('FINAL SCORE:',this.x,this.y-12);
				context.fillText(_SCORE+50*Math.max(_LIFE-1,0),this.x,this.y+12);
			}
		});
		//事件绑定
		stage.bind('keydown',function(e){
			switch(e.keyCode){
				case 13: //回车
				case 32: //空格
				_SCORE = 0;
				_LIFE = 5;
				game.setStage(1);
				break;
			}
		});
	})();

	game.init();
	requestAnimationFrame(function () {
		requestAnimationFrame(function () {
			try { game.nextStage(); } catch (e) {}
		});
	});
})();

</script>
</body>
</html>

<!doctype html>
<!-- jmr-toolbox: resident-v2 -->
<html><head><title>Session Example</title></head><body><canvas width="640" height="480"></canvas><script>
// BEGIN shared scroll_client.js
// Shared bitmap scrolling. Two caller-owned descriptors; no saved screen image.
// Coordinates are local to the active Port; exposed strips enter bounded damage.
function tbScrollRect(src,dst,x,y,w,h,dx,dy){
 var a=Math.abs(dx),b=Math.abs(dy),p=tbPortBounds(),n;
 if(a>=w||b>=h){tbDamage(x+p[4],y+p[5],w,h);return 0;}
 tbScreen(src);tbScreen(dst);
 tbRect(src,x+p[4]+(dx<0?a:0),y+p[5]+(dy<0?b:0),w-a,h-b);
 tbRect(dst,0,0,w-a,h-b);tbPlaceScreen(dst,x+(dx>0?a:0),y+(dy>0?b:0),1);
 n=tbCopyBits(src,dst);if(n<0)return n;
 if(a)tbDamage(x+p[4]+(dx<0?w-a:0),y+p[5],a,h);
 if(b)tbDamage(x+p[4],y+p[5]+(dy<0?h-b:0),w,b);
 return n;
}
// END shared scroll_client.js

// BEGIN shared window_client.js
// Shared bounded window stacking policy; IDs are0..7, back to front.
var tbClientOrder=[];
function tbWindowFocus(id){if(id<0||id>7||id!=Math.floor(id))return -1;tbWindowRemove(id);tbClientOrder.push(id);return id;}
function tbWindowRemove(id){
 var i=0,j=0;while(i<tbClientOrder.length){if(tbClientOrder[i]!=id){tbClientOrder[j]=tbClientOrder[i];j=j+1;}i=i+1;}
 tbClientOrder.length=j;return j?tbClientOrder[j-1]:255;
}
function tbWindowAt(i){return i>=0&&i<tbClientOrder.length?tbClientOrder[i]:255;}
// END shared window_client.js

// Session Example: a small text viewer that keeps its own files.
// It shows the parts of the session a document program needs:
//   File > New sample, Open... and Save As... (the session draws the dialogs;
//   the program reads and writes the bytes with fsRead / fsWrite),
//   scroll bars that move the view (keys 128-133 from chrome_client.js),
//   a window the user can resize (tbClientResize), check marks and a dimmed item.
// The text lives in this program's own arena bytes 60000..68191, not in SOURCE,
// so the Editor's document is never touched. The session owns 96..111 and 380320..380927.
var demoCtx=document.querySelector("canvas").getContext("2d");
var BUF=60000,CAP=8192,ROW=18,LIST=160;
var docLen=0,starts=[],top=0,left=0,viewW=576,viewH=344,dirty=1,marked=0;
var status="File > New sample makes a text to scroll.";
var downs=0,ups=0,moves=0,keys=0;
tbSessionProperty(demoCtx,0,4);
tbSessionProperty(demoCtx,2,"Session Example|A text viewer with its own files: New|sample, Save As..., Open..., scroll bars,|resizing and check marks.|Read the source to see how.");
tbSessionProperty(demoCtx,4,"Session Example");
tbSessionProperty(demoCtx,5,15);   // 160..163 enabled; 164 (Disabled) dimmed
tbSessionProgram("UISESS.HTM");tbSessionSuffix("TXT");
tbSessionMenus(demoCtx,"File|New sample=160|Open...=161|Save As...=162|Quit=1006;Demo|Check me=163|Disabled=164");
// Index the lines of the text: starts[i] is where line i begins (at most 120 lines).
function index(){
 var i=0;starts=[0];
 while(i<docLen&&starts.length<120){if(stgRead(BUF+i)==10&&i+1<docLen)starts.push(i+1);i=i+1;}
 top=0;left=0;bars();
}
function put(b){if(docLen<CAP){stgWrite(BUF+docLen,b);docLen=docLen+1;}}
function putCodes(a){var i=0;while(i<a.length){put(a[i]);i=i+1;}}
function putNumber(n){if(n>=10)putNumber(Math.floor(n/10));put(48+n%10);}
function newSample(){
 var n=1,words=[tbSessionCodes("Line "),tbSessionCodes(" of the sample. Scroll down with the bar, Page Down or the arrows; this line is long so the bottom bar scrolls it sideways too.")];
 docLen=0;
 while(n<=60){putCodes(words[0]);putNumber(n);putCodes(words[1]);put(10);n=n+1;}
 index();status="Sample made. Try File > Save As...";dirty=1;
}
function openChosen(){
 var n=fsRead(96,0,BUF,CAP);
 if(n<0){status="That file could not be read.";dirty=1;return;}
 docLen=n;index();status="Opened.";dirty=1;
}
function saveChosen(){
 var w=fsWrite(96,BUF,docLen,0);
 status=w==docLen?"Saved.":"The file could not be written.";dirty=1;
}
function rows(){return Math.max(1,Math.floor((viewH-(LIST-88))/ROW));}
function maxTop(){return Math.max(0,starts.length-rows());}
// Report the view to the scroll bars: 0..255 along each bar.
function bars(){
 tbSessionProperty(demoCtx,7,Math.floor(top*255/Math.max(1,maxTop())));
 tbSessionProperty(demoCtx,8,Math.floor(left*255/40));
}
function scrollBy(dy,dx){
 top=Math.min(maxTop(),Math.max(0,top+dy));left=Math.min(40,Math.max(0,left+dx));
 bars();dirty=1;
}
var line=[];
function draw(){
 var r=0,i,e,y;
 tbSessionTransform(1,0,0,1,0,0);
 demoCtx.fillStyle="#FFF";demoCtx.fillRect(24,88,576,344);
 tbText(status,36,96);
 tbText("Mouse down, up, moves, keys:",36,118);
 demoCtx.fillStyle="#000";demoCtx.font="16px";
 demoCtx.fillText(downs,260,132);demoCtx.fillText(ups,310,132);demoCtx.fillText(moves,360,132);demoCtx.fillText(keys,430,132);
 demoCtx.fillRect(24,LIST-8,576,1);
 if(!docLen)tbText("No text yet.",36,LIST);
 while(r<rows()&&top+r<starts.length){
  i=starts[top+r]+left;e=top+r+1<starts.length?starts[top+r+1]:docLen;line.length=0;
  while(i<e&&line.length<80){if(stgRead(BUF+i)!=10)line.push(stgRead(BUF+i));i=i+1;}
  tbText(line,36,LIST+r*ROW);r=r+1;
 }
 dirty=0;
}
tbSessionListen("keydown",function(e){
 var k=e.keyCode;keys=keys+1;dirty=1;
 if(k==160)newSample();
 else if(k==161)openChosen();   // the session forwards this after Open accepts a name
 else if(k==162)saveChosen();   // ... and this after the name (and Replace) is accepted
 else if(k==163){marked=1-marked;tbSessionProperty(demoCtx,6,marked?8:0);}
 else if(k==128||k==38)scrollBy(-1,0);
 else if(k==129||k==40)scrollBy(1,0);
 else if(k==130)scrollBy(-rows(),0);
 else if(k==131)scrollBy(rows(),0);
 else if(k==132||k==37)scrollBy(0,-4);
 else if(k==133||k==39)scrollBy(0,4);
});
tbSessionListen("mousedown",function(e){downs=downs+1;dirty=1;});
tbSessionListen("mousemove",function(e){moves=moves+1;dirty=1;});
tbSessionListen("mouseup",function(e){ups=ups+1;dirty=1;});
tbSessionInvalidate(draw);
function frame(){if(dirty)draw();tbSessionFrame(frame);}
tbSessionFrame(frame);

// BEGIN shared filename_client.js
// Shared file-name policy, embedded into clients that own Save As.
function tbClientFilename(a,ext,kind){
 var i=0,c,stem=0,n=0,dot=0,j,legal,on;
 if(kind){
  if(ext=="")return 1;while(i<a.length){if(a[i]==46)dot=i+1;i=i+1;}
  if(dot==0)return 0;i=dot;while(i<a.length){if(a[i]!=strByte(ext,i-dot))return 0;i=i+1;}return strByte(ext,i-dot)<0;
 }
 while(i<a.length){
  c=a[i];if(c>=97&&c<=122)c=c-32;a[i]=c;
  if(c==46){if(dot||stem==0)return 0;dot=1;}
  else{
   on=(c>=65&&c<=90)||(c>=48&&c<=57);j=0;
   while(j<17&&!on){legal=strByte("$%'-_@~`!(){}^#&",j);if(c==legal)on=1;j=j+1;}
   if(!on)return 0;if(dot)n=n+1;else stem=stem+1;
  }i=i+1;
 }
 if(stem<1||stem>8||n>3||(dot&&n==0))return 0;
 if(!dot){
  a.push(46);i=0;
  while(i<3){c=strByte(ext,i);if(c<0)break;a.push(c);i=i+1;}
 }
 if(a.length>12)return 0;return 1;
}
tbSessionNames(tbClientFilename);
// END shared filename_client.js
// BEGIN shared chrome_client.js
// Shared document scroll controls, using the common Window and Control geometry.
var tbClientScroll=0;
function tbClientChrome(mode,x,y){
 var a=tbWindowBounds(),code=0,scroll=tbClientScroll;
 if(mode==2){tbClientResize(x,y);return 0;}
 if(mode==1){

  if(x>=a[0]+a[2]-19&&x<a[0]+a[2]-1&&y>=a[1]+54&&y<a[1]+a[3]-22){code=tbControlPart(y,a[1]+54,a[3]-76,20,a[1]+76+Math.floor(Math.max(0,a[3]-140)*scroll/255),Math.min(20,Math.max(0,a[3]-116)));code=code==4?128:code==5?129:code==8?130:131;}
  if(y>=a[1]+a[3]-20&&y<a[1]+a[3]-1){if(x>=a[0]+2&&x<a[0]+20)code=132;else if(x>=a[0]+a[2]-38&&x<a[0]+a[2]-20)code=133;}
 
 return code;
 }
 tbClientScroll=x;scroll=x;

   tbBox(a[0]+a[2]-19,a[1]+54,18,a[3]-76,"#CCC");tbBox(a[0]+a[2]-19,a[1]+54,18,20,"#FFF");tbClientArrow(a[0]+a[2]-14,a[1]+61,0);
   tbBox(a[0]+a[2]-19,a[1]+a[3]-40,18,18,"#FFF");tbClientArrow(a[0]+a[2]-14,a[1]+a[3]-34,1);
   tbBox(a[0]+a[2]-17,a[1]+76+Math.floor(Math.max(0,a[3]-140)*scroll/255),14,Math.min(20,Math.max(0,a[3]-116)),"#FFF");
   tbBox(a[0]+2,a[1]+a[3]-20,a[2]-22,19,"#CCC");tbBox(a[0]+2,a[1]+a[3]-20,18,19,"#FFF");tbClientArrow(a[0]+9,a[1]+a[3]-15,2);
   tbBox(a[0]+a[2]-38,a[1]+a[3]-20,18,19,"#FFF");tbClientArrow(a[0]+a[2]-31,a[1]+a[3]-15,3);
   // Grow box: two overlapping squares in the corner between the bars.
   tbBox(a[0]+a[2]-20,a[1]+a[3]-22,20,22,"#FFF");tbBox(a[0]+a[2]-16,a[1]+a[3]-18,8,8,"#FFF");tbBox(a[0]+a[2]-13,a[1]+a[3]-15,9,9,"#FFF");
  
 return 0;
}
// A filled arrow, 9 by 5 pixels (up 0, down 1) or 5 by 9 (left 2, right 3).
function tbClientArrow(x,y,d){
 var i=0;
 while(i<5){
  if(d==0)tbBox(x+4-i,y+i,1+2*i,1,"#000");else if(d==1)tbBox(x+i,y+i,9-2*i,1,"#000");
  else if(d==2)tbBox(x+i,y+4-i,1,1+2*i,"#000");else tbBox(x+i,y+i,1,9-2*i,"#000");
  i=i+1;
 }
}
tbSessionChrome(tbClientChrome);
// END shared chrome_client.js
function tbClientResize(w,h){viewW=w;viewH=h;top=Math.min(top,maxTop());bars();dirty=1;}
</script></body></html>

<!DOCTYPE html>

<!--
  READ.HTML — DO NOT DELETE. The machine's text reader (not a game).
  Bare READ chain-loads READ.JSH and leaves SOURCE holding the file
  LOAD parked. READ "NAME.MD" loads that file first.

  Formats a small markdown subset by walking bytes. No string
  methods. # and ## are drawn at twice the body size, without the
  marks. ### stays a small heading. "- " and "* " become an
  indented square, not the source hyphen. ">" is a quote. A line
  of dashes is a rule. Up/Down one line. Left/Right or F3/F4 one page.
  Esc is machine BREAK. Do not bind it.
-->
<canvas id="gameCanvas" width="640" height="480"></canvas>
<script data-host="chrome">
// Chrome-only. Maps the machine's sprite handles to the real PNGs.
// This list is ALSO the art manifest make_artx.py reads — one source of
// truth, so the browser and the .ARTX can never disagree about order.
window.JMR_SPR = ["READ-0.png"];
(function () {
  var d = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, "src");
  Object.defineProperty(HTMLImageElement.prototype, "src", {
    get: function () { return d.get.call(this); },
    set: function (v) {
      var m = /^jmr:spr:(\d+)$/.exec(v);
      d.set.call(this, m ? window.JMR_SPR[+m[1]] : v);
    }
  });
})();
</script>

function lineLen(i) {
  var s = lineStart(i);
  var e = (i + 1 < nLines) ? lineStart(i + 1) : srcLen();
  if(e>s && srcByte(e-1)===10){e=e-1;}
  if (e > s && srcByte(e - 1) === 13) { e = e - 1; }
  if (e < s) { return 0; }

}

function hashes(li) {
  var s, n, h;
  s = lineStart(li);
  n = lineLen(li);
  h = 0;
  while (h < n && h < 6 && srcByte(s + h) === 35) { h = h + 1; }
  return h;
}

function kindOf(li) {
  var s, n, b, c;
  n = lineLen(li);
  if (n < 1) { return 0; }
  s = lineStart(li);
  b = srcByte(s);
  if (b === 35) {
    c = hashes(li);
    if (c >= 3) { return 3; }
    if (c === 2) { return 2; }
    return 1;
  }
  if (b === 45) {
    c = 0;
    while (c < n && srcByte(s + c) === 45) { c = c + 1; }
    if (c === n && n >= 3) { return 7; }

  }
  if (b === 42 && n > 1 && srcByte(s + 1) === 32) { return 4; }
  if (b === 62 && n > 1 && srcByte(s + 1) === 32) { return 5; }

function skipOf(li, kind) {
  var s, n, h;
  if (kind === 4 || kind === 5) { return 2; }
  if (kind < 1 || kind > 3) { return 0; }
  h = hashes(li);
  s = lineStart(li);
  n = lineLen(li);
  if (h < n && srcByte(s + h) === 32) { return h + 1; }
  return h;
}

function lineH(li) {
  var k=kindOf(li);
  if(k===1 || k===2)return 36;
  if(k===0)return 8;
  if(k===7)return 12;

}

function glyph(b,x,y,blue,big){
  var s;
  if(b>=32 && b<127){

    ctx.drawImage(fontImage,(b%32)*16,Math.floor(b/32)*16+blue*64,16,16,x,y,s,s);
  }
}
function drawChars(li,y,skip,blue,x0,big){
  var p=tbDrawBounds(0,y,640,big?32:16),left=p[0],right=p[2];
  var s=lineStart(li),n=lineLen(li),c=skip,b,x=x0,step;
  if(p[3]<=p[1]||right<=left)return;
  while(c<n && x<560 && x<right){
    b=srcByte(s+c);if(x+(big?32:16)>left)glyph(b,x,y,blue,big);
    if(b>=32 && b<127){step=ADV[b];if(big)step=step+step;x=x+step;}

}
function drawLine(li,y){
  var kind=kindOf(li);

  if(kind===7){ctx.fillStyle="#0055EE";ctx.fillRect(28,y+6,550,1);return;}
  if(kind===4){ctx.fillStyle="#000000";ctx.fillRect(32,y+6,6,6);drawChars(li,y,2,0,48,0);return;}
  if(kind===5){ctx.fillStyle="#999999";ctx.fillRect(29,y,2,14);drawChars(li,y,2,0,42,0);return;}
  drawChars(li,y,skipOf(li,kind),(kind===1 || kind===2 || kind===3)?1:0,28,(kind===1 || kind===2)?1:0);
}

function pageUp() {
  var y, li;
  if (topLine <= 0) { topLine = 0; return; }
  y = 0;
  li = topLine;
  while (li > 0 && y < readerHeight) {
    li = li - 1;
    y = y + lineH(li);
  }
  if (y > readerHeight) { li = li + 1; }
  topLine = li;
}

function pageDown() {
  var y, li;
  y = 0;
  li = topLine;
  while (li < nLines && y < readerHeight) {
    y = y + lineH(li);
    li = li + 1;
  }
  if (li < nLines) { topLine = li; }
}

function draw(){
  var y=96,li=topLine,p=tbDrawBounds(24,88,576,344),top=p[1],bottom=p[3];
  tbSessionProperty(ctx,7,Math.floor(topLine*255/Math.max(1,nLines-20)));
  tbSessionProperty(ctx,8,0);tbSessionProperty(ctx,9,0);
  if(p[2]<=p[0]||bottom<=top)return;
  ctx.fillStyle="#FFFFFF";ctx.fillRect(p[0],p[1],p[2]-p[0],bottom-top);
  while(li<nLines && y<Math.min(96+readerHeight,bottom)){if(y+lineH(li)>top)drawLine(li,y);y=y+lineH(li);li=li+1;}
}

function onKey(e) {
  var k,old=topLine;
  k = e.keyCode;
  if(k===116){quit=1;cdone(0,0,0);return;}
  if(k===128){if(topLine>0)topLine=topLine-1;needDraw=1;scrollReader(old);return;}
  if(k===129){if(topLine+1<nLines)topLine=topLine+1;needDraw=1;scrollReader(old);return;}
  if(k===130){pageUp();needDraw=1;scrollReader(old);return;}
  if(k===131){pageDown();needDraw=1;scrollReader(old);return;}
  if (k === 38) { if (topLine > 0) { topLine = topLine - 1; } }
  else if (k === 40) { if (topLine + 1 < nLines) { topLine = topLine + 1; } }
  else if (k === 37 || k === 114 || k === 33) { pageUp(); }
  else if (k === 39 || k === 115 || k === 34) { pageDown(); }
  needDraw = 1;scrollReader(old);
}

function scrollReader(old){
 var a=tbWindowBounds(),i=topLine,n=0,dy,p;
 if(old==topLine)return;if(i>old)i=old;
 while(i<Math.max(old,topLine)&&n<readerHeight){n=n+lineH(i);i=i+1;}
 dy=old<topLine?-n:n;n=tbScrollRect(36928,36992,24,96,a[2]-36,readerHeight,0,dy);
 if(n>=0){
  // A final 32-pixel heading may extend16px beyond the line-start band.
  if(dy>0&&dy<readerHeight){tbDamageClip();draw();tbPortPop();tbDamageClear();}
  p=tbPortBounds();tbDamage(24+p[4],96+readerHeight+p[5],a[2]-36,16);
  tbDamageClip();draw();tbPortPop();tbDamageClear();needDraw=0;
 }
}
function tick() {
  if(quit)return;
  if (needDraw) { draw(); needDraw = 0; }
  tbSessionFrame(tick);
}

// Text only: .MD, .TXT, .HTM, .JS, .BAS or no extension, and no NUL in the first 4 KB.
// Anything else gets an alert and goes back to Finder unread.

  n=stgRead(380336);
  while(i<n){c=stgRead(380320+i);if(c===46)d=1;e=c===46?0:e*256+c;i=i+1;}
  if(d&&e!==19780&&e!==5527636&&e!==4740173&&e!==19027&&e!==4342099)return 0;
  i=0;n=Math.min(srcLen(),4096);
  while(i<n){if(srcByte(i)===0)return 0;i=i+1;}
  return 1;
}
var unreadable=!readable();
tbSessionDocument(function(action,value){

  if(action===5&&unreadable){tbDocumentContinue(3);return 1;}

});

else reindex();
tbSessionListen("keydown", onKey);
// Window controls are system-owned; the body retains page-click reading.
tbSessionListen("mousedown",function(e){
  if(e.button===0 && e.clientX>=24 && e.clientX<600 && e.clientY>=88 && e.clientY<432){
    if(e.clientY<260)pageUp();else pageDown();needDraw=1;

tbSessionProgram('READ.HTM');
tbSessionInvalidate(function(){draw();needDraw=0;});

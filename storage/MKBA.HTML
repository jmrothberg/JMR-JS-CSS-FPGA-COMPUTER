    if (loaded >= need) {
      drawFighter(p1);
      drawFighter(p2);
    }
  }

  if (loaded < need) {
    c.fillStyle = "#000";
    c.fillRect(180, 200, 280, 40);
    c.fillStyle = "#e8c14a";
    c.font = "14px monospace";
    c.fillText("Loading", 240, 225);
    c.fillText(loaded, 300, 225);
  } else if (mode === ATTRACT) {
    /* 16px/8px: machine glyphs are 8×8 × round(px/8). 26px was 3× and clipped. */
    c.fillStyle = "#000";
    c.fillRect(160, 160, 320, 100);
    c.fillStyle = "#e8c14a";
    c.font = "16px monospace";
    c.fillText("MK BIG", 272, 196);
    c.fillStyle = "#fff";
    c.font = "8px monospace";
    c.fillText("F or O to start", 260, 228);
  }
  if (mode === OVER) {
    c.fillStyle = "#000";
    c.fillRect(140, 150, 360, 120);
    c.fillStyle = "#e8c14a";
    c.font = "16px monospace";
    c.fillText(winner, 168, 190);
    c.fillStyle = "#fff";
    c.font = "8px monospace";
    c.fillText("SCORE  P1 " + p1Wins + "  P2 " + p2Wins, 200, 220);
    if (matchDone) {
      c.fillText("F/O or P punch = new match", 200, 250);
    } else {
      c.fillText("F/O or P punch = next round", 200, 250);
    }
  }

  c.fillStyle = "#000";
  c.fillRect(0, H - 44, W, 44);
  c.fillStyle = "#fff";
  c.font = "8px monospace";
  c.fillText("P1: WASD/stick  F/fire1 punch  G/fire2 kick", 8, H - 28);
  c.fillText("P2: arrows  Enter block  O punch  P kick", 8, H - 10);
}

function frame() {
  update();
  draw();
  requestAnimationFrame(frame);
}

function setKey(e, down) {
  var code = e.keyCode;
  var key = e.key;
  var j = stickBits();
  if (key === "a" || key === "A" || code === 65) k1.left = down;
  if (key === "d" || key === "D" || code === 68) k1.right = down;
  if (key === "w" || key === "W" || code === 87) k1.up = down;
  if (key === "s" || key === "S" || code === 83) k1.down = down;
  if (key === "f" || key === "F" || code === 70) k1.punch = down;
  if (key === "g" || key === "G" || code === 71) k1.kick = down;
  // RTL maps stick → arrows/Enter; those must not drive P2 while the stick is held
  if ((code === 37 || key === "ArrowLeft") && !(j & 4)) k2.left = down;
  if ((code === 39 || key === "ArrowRight") && !(j & 8)) k2.right = down;
  if ((code === 38 || key === "ArrowUp") && !(j & 1)) k2.up = down;
  if ((code === 40 || key === "ArrowDown") && !(j & 2)) k2.down = down;
  if ((code === 13 || key === "Enter") && !(j & 32)) k2.down = down;
  if (key === "o" || key === "O" || code === 79) k2.punch = down;
  if (key === "p" || key === "P" || code === 80) k2.kick = down;
}

document.addEventListener("keydown", function (e) { setKey(e, 1); }, false);
document.addEventListener("keyup", function (e) { setKey(e, 0); }, false);

loadAll();
requestAnimationFrame(frame);


</script>
<script data-host="chrome">
(function(){
var ctx=null,noise=null;
function ac(){
  var AC,i,d;
  if(ctx) return ctx;
  AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return null;
  ctx=new AC();
  noise=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
  d=noise.getChannelData(0);
  for(i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  return ctx;
}
window._chromePlay=function(r){
  var a,i,freq,vol,frames,slide,ch,dur,t0,osc,g,endF;
  a=ac();
  if(!a||!r||!r.length) return;
  if(a.state==="suspended") a.resume();
  t0=a.currentTime;
  for(i=0;i+4<r.length;i=i+5){
    freq=r[i]; vol=r[i+1]; frames=r[i+2]; slide=r[i+3]; ch=r[i+4];
    if(vol<=0||frames<=0) continue;
    dur=frames/60;
    if(dur<0.02) dur=0.02;
    g=a.createGain();
    g.gain.setValueAtTime((vol/15)*0.1,t0);
    g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    g.connect(a.destination);
    if(ch===3){
      osc=a.createBufferSource();
      osc.buffer=noise;
      osc.loop=true;
    }else{
      osc=a.createOscillator();
      osc.type="square";
      osc.frequency.setValueAtTime(Math.max(20,freq),t0);
      endF=freq+slide*frames;
      if(endF<20) endF=20;
      osc.frequency.linearRampToValueAtTime(endF,t0+dur);
    }
    osc.connect(g);
    osc.start(t0);
    osc.stop(t0+dur);
  }
};
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bomberman FAST</title>
<style>
  html,body{margin:0;background:#0b1020;overflow:hidden;height:100%;}
  #wrap{position:fixed;inset:0;display:grid;place-items:center;}
  canvas{background:#0e1a0e;image-rendering:pixelated;max-width:98vw;max-height:98vh;}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="640" height="480"></canvas></div>
<script data-host="chrome" src="BOMBFAST.ARTJS"></script>
<script data-host="chrome">
window.JMR_SPR = ["BOMBERMA-0.png", "BOMBERMA-1.png", "BOMBERMA-2.png", "BOMBERMA-3.png", "BOMBERMA-4.png", "BOMBERMA-5.png", "BOMBERMA-6.png", "BOMBERMA-7.png", "BOMBERMA-8.png", "BOMBERMA-9.png", "BOMBERMA-10.png", "BOMBERMA-11.png", "BOMBERMA-12.png", "BOMBERMA-13.png"];
(function () {
  if (typeof __jmrSpr === "undefined") { return; }
  var d = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, "src");
  Object.defineProperty(HTMLImageElement.prototype, "src", {
    get: function () { return d.get.call(this); },
    set: function (v) {
      var m = /^jmr:spr:(\d+)$/.exec(String(v));
      d.set.call(this, m ? (__jmrSpr[+m[1]] || v) : v);
    }
  });
})();
</script>
<script>
(function(){
"use strict";
/* Bomberman FAST — same play as BOMBERMA.HTML (keep BOMBERMA as the control).
   LOAD "BOMBFAST.HTML" then RUN.
   FAST: dirty-tile restore (DNKFAST/MRDOFAST) — do not fillRect 640×480 + 300
   tiles every rAF. Maze cell 3 = bomb so solid/walkable stay O(1). F.exp
   occupancy (no list scan). Enemy dirs from DX/DY + reused F.oi (no per-step
   arrays). fillText numbers, not ""+n (intern table). Frame bomb cooldown.
   Pools: reuse dead bomb/explosion/enemy slots. Same 14 sheets as BOMBERMA. */
var cvs=document.getElementById("c");
var ctx=cvs.getContext("2d");
ctx.imageSmoothingEnabled=false;
if(!window.JMR_SPR){window.JMR_SPR=["BOMBERMA-0.png","BOMBERMA-1.png","BOMBERMA-2.png","BOMBERMA-3.png","BOMBERMA-4.png","BOMBERMA-5.png","BOMBERMA-6.png","BOMBERMA-7.png","BOMBERMA-8.png","BOMBERMA-9.png","BOMBERMA-10.png","BOMBERMA-11.png","BOMBERMA-12.png","BOMBERMA-13.png"];}
var COLS=20,ROWS=15,TILE=32;
var IMG=[];
/* RTL Image.src binds ASET only when "jmr:spr:N" is an interned literal. */
IMG[0]=new Image();IMG[0].src="jmr:spr:0";
IMG[1]=new Image();IMG[1].src="jmr:spr:1";
IMG[2]=new Image();IMG[2].src="jmr:spr:2";
IMG[3]=new Image();IMG[3].src="jmr:spr:3";
IMG[4]=new Image();IMG[4].src="jmr:spr:4";
IMG[5]=new Image();IMG[5].src="jmr:spr:5";
IMG[6]=new Image();IMG[6].src="jmr:spr:6";
IMG[7]=new Image();IMG[7].src="jmr:spr:7";
IMG[8]=new Image();IMG[8].src="jmr:spr:8";
IMG[9]=new Image();IMG[9].src="jmr:spr:9";
IMG[10]=new Image();IMG[10].src="jmr:spr:10";
IMG[11]=new Image();IMG[11].src="jmr:spr:11";
IMG[12]=new Image();IMG[12].src="jmr:spr:12";
IMG[13]=new Image();IMG[13].src="jmr:spr:13";
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}

/* One bag — IIFE locals count against ENV_SLOTS=16. */
var F={DX:[1,-1,0,0],DY:[0,0,1,-1],oi:[0,0,0,0],oj:[0,0,0,0],
  exp:[],dc:[],dr:[],dn:0,full:1};

var state={maze:[],player:null,bombs:[],explosions:[],enemies:[],powerups:[],
  score:0,lives:3,level:1,over:false,win:false,exitX:0,exitY:0,spawnX:1,spawnY:1,enemiesLeft:0,tick:0,canBombAt:0};
window.state=state;

var keys={left:0,right:0,up:0,down:0,fire:0};
function onDown(e){
  var k=e.key,c=e.keyCode;
  if(k==="ArrowLeft"||k==="a"||k==="A"||c===37||c===65)keys.left=1;
  if(k==="ArrowRight"||k==="d"||k==="D"||c===39||c===68)keys.right=1;
  if(k==="ArrowUp"||k==="w"||k==="W"||c===38||c===87)keys.up=1;
  if(k==="ArrowDown"||k==="s"||k==="S"||c===40||c===83)keys.down=1;
  if(k===" "||c===32)keys.fire=1;
  if(k==="r"||k==="R"||c===82)doReset();
}
function onUp(e){
  var k=e.key,c=e.keyCode;
  if(k==="ArrowLeft"||k==="a"||k==="A"||c===37||c===65)keys.left=0;
  if(k==="ArrowRight"||k==="d"||k==="D"||c===39||c===68)keys.right=0;
  if(k==="ArrowUp"||k==="w"||k==="W"||c===38||c===87)keys.up=0;
  if(k==="ArrowDown"||k==="s"||k==="S"||c===40||c===83)keys.down=0;
  if(k===" "||c===32)keys.fire=0;
}
addEventListener("keydown",onDown);
addEventListener("keyup",onUp);
function stick(){
  var j;
  try{j=joy()|0;}catch(e){j=0;}
  return j;
}

function inb(tx,ty){return tx>=0&&ty>=0&&tx<COLS&&ty<ROWS;}
function cell(tx,ty){return inb(tx,ty)?state.maze[ty][tx]:1;}
function bombAt(tx,ty){
  var i,b;
  for(i=0;i<state.bombs.length;i++){
    b=state.bombs[i];
    if(!b.dead&&b.tx===tx&&b.ty===ty)return b;
  }
  return null;
}
/* Maze: 0 floor, 1 hard, 2 soft, 3 bomb. No bombAt in the move hot path. */
function solid(tx,ty){var v=cell(tx,ty);return v===1||v===2||v===3;}
function walkable(tx,ty){return inb(tx,ty)&&state.maze[ty][tx]===0;}

function dirtyTile(tx,ty){
  if(!inb(tx,ty))return;
  if(F.dn>=128){F.full=1;return;}
  F.dc[F.dn]=tx;F.dr[F.dn]=ty;F.dn=F.dn+1;
}
function dirtyPix(px,py){
  var x0,y0,x1,y1,tx,ty;
  /* dest is [px-16,px+16)×[py-16,py+16). Speed 2.3 / 1.4 leaves fractional
     coords; that 32×32 blit spills onto the next pillar tile. Corners-only
     also misses the middle tile when the padded box spans 3 cells. */
  x0=Math.floor((px-17)/TILE);y0=Math.floor((py-17)/TILE);
  x1=Math.floor((px+16)/TILE);y1=Math.floor((py+16)/TILE);
  for(ty=y0;ty<=y1;ty++){
    for(tx=x0;tx<=x1;tx++)dirtyTile(tx,ty);
  }
}

function ensureRows(g){
  var c,row;
  while(g.length<ROWS){
    row=[];
    for(c=0;c<COLS;c++)row.push(0);
    g.push(row);
  }
}
function clearExp(){
  var r,c,row;
  for(r=0;r<ROWS;r++){
    row=F.exp[r];
    for(c=0;c<COLS;c++)row[c]=0;
  }
}
function killList(list){
  var i;
  for(i=0;i<list.length;i++)list[i].dead=true;
}

function buildMaze(){
  var m,r,c,row,ex,ey;
  ensureRows(state.maze);ensureRows(F.exp);
  m=state.maze;
  for(r=0;r<ROWS;r++){
    row=m[r];
    for(c=0;c<COLS;c++){
      if(r===0||c===0||r===ROWS-1||c===COLS-1)row[c]=1;
      else if(r%2===0&&c%2===0)row[c]=1;
      else row[c]=0;
    }
  }
  ex=COLS-2;ey=ROWS-2;state.exitX=ex;state.exitY=ey;
  state.spawnX=1;state.spawnY=1;
  for(r=1;r<ROWS-1;r++){for(c=1;c<COLS-1;c++){
    if(m[r][c]!==0)continue;
    if(c<=2&&r<=2)continue;
    if(c===ex&&r===ey)continue;
    if(Math.random()<0.45)m[r][c]=2;
  }}
  m[ey][ex]=0;
  if(m[ey][ex-1]===2)m[ey][ex-1]=0;
  if(m[ey-1][ex]===2)m[ey-1][ex]=0;
  clearExp();
  F.full=1;F.dn=0;
}

function allocEnemy(){
  var i,e;
  for(i=0;i<state.enemies.length;i++){
    if(state.enemies[i].dead){e=state.enemies[i];e.dead=false;return e;}
  }
  e={tx:0,ty:0,px:0,py:0,dirx:0,diry:0,animT:0,dead:false,lx:0,ly:0};
  state.enemies.push(e);
  return e;
}
function spawnEnemies(n){
  var placed,tries,tx,ty,e;
  killList(state.enemies);
  placed=0;tries=0;
  while(placed<n&&tries<400){tries++;
    tx=rnd(1,COLS-2);ty=rnd(1,ROWS-2);
    if(state.maze[ty][tx]!==0)continue;
    if(tx<=3&&ty<=3)continue;
    if(tx===state.exitX&&ty===state.exitY)continue;
    e=allocEnemy();
    e.tx=tx;e.ty=ty;e.px=tx*TILE+16;e.py=ty*TILE+16;
    e.lx=e.px;e.ly=e.py;e.dirx=0;e.diry=0;e.animT=0;
    placed++;
  }
  state.enemiesLeft=placed;
}

function resetLevel(full){
  var p;
  buildMaze();
  killList(state.bombs);killList(state.explosions);killList(state.powerups);
  p=state.player;
  if(!p){p={x:0,y:0,dir:0,moving:false,animT:0,bombMax:1,bombRange:2,alive:true,inv:0,tx:1,ty:1,lx:0,ly:0};state.player=p;}
  if(full){p.bombMax=1;p.bombRange=2;}
  p.x=state.spawnX*TILE+16;p.y=state.spawnY*TILE+16;p.alive=true;p.inv=90;p.moving=false;
  p.tx=state.spawnX;p.ty=state.spawnY;p.lx=p.x;p.ly=p.y;
  state.canBombAt=0;
  spawnEnemies(3+state.level);
  state.win=false;
  F.full=1;
}

function doReset(){
  state.score=0;state.lives=3;state.level=1;state.over=false;state.win=false;
  state.player=null;
  resetLevel(true);
}
window.game={reset:doReset};

function allocBomb(){
  var i,b;
  for(i=0;i<state.bombs.length;i++){
    if(state.bombs[i].dead){b=state.bombs[i];b.dead=false;b.done=false;return b;}
  }
  b={tx:0,ty:0,fuse:0,range:0,owner:0,dead:false,done:false};
  state.bombs.push(b);
  return b;
}
function dropBomb(){
  var p,tx,ty,mine,i,b;
  if(!state.player||!state.player.alive||state.over||state.win)return;
  if(state.tick<state.canBombAt)return;
  p=state.player;tx=Math.floor(p.x/TILE);ty=Math.floor(p.y/TILE);
  if(state.maze[ty][tx]!==0)return;
  mine=0;for(i=0;i<state.bombs.length;i++){if(!state.bombs[i].dead&&state.bombs[i].owner===1)mine++;}
  if(mine>=p.bombMax)return;
  state.canBombAt=state.tick+9;
  b=allocBomb();
  b.tx=tx;b.ty=ty;b.fuse=150;b.range=p.bombRange;b.owner=1;
  state.maze[ty][tx]=3;
  dirtyTile(tx,ty);
}

function allocExpl(){
  var i,x;
  for(i=0;i<state.explosions.length;i++){
    if(state.explosions[i].dead){x=state.explosions[i];x.dead=false;return x;}
  }
  x={tx:0,ty:0,life:0,dead:false};
  state.explosions.push(x);
  return x;
}
function addExplosion(tx,ty){
  var x;
  if(!inb(tx,ty))return;
  if(F.exp[ty][tx])return;
  F.exp[ty][tx]=1;
  dirtyTile(tx,ty);
  x=allocExpl();
  x.tx=tx;x.ty=ty;x.life=34;
}

function allocPower(){
  var i,pu;
  for(i=0;i<state.powerups.length;i++){
    if(state.powerups[i].dead){pu=state.powerups[i];pu.dead=false;return pu;}
  }
  pu={tx:0,ty:0,type:0,dead:false};
  state.powerups.push(pu);
  return pu;
}
function destroySoft(tx,ty){
  var rr,pu;
  state.maze[ty][tx]=0;state.score+=10;
  dirtyTile(tx,ty);
  rr=Math.random();
  if(rr<0.24){
    pu=allocPower();
    pu.tx=tx;pu.ty=ty;pu.type=rr<0.12?0:1;
  }
}

function triggerBomb(b){
  var d,s,nx,ny,v,ob;
  if(b.done)return;b.done=true;
  addExplosion(b.tx,b.ty);
  for(d=0;d<4;d++){
    for(s=1;s<=b.range;s++){
      nx=b.tx+F.DX[d]*s;ny=b.ty+F.DY[d]*s;
      if(!inb(nx,ny))break;
      v=state.maze[ny][nx];
      if(v===1)break;
      if(v===2){addExplosion(nx,ny);destroySoft(nx,ny);break;}
      addExplosion(nx,ny);
      ob=bombAt(nx,ny);if(ob&&ob!==b)ob.fuse=1;
    }
  }
}

function tryMoveX(p,dx,sp){
  var nx,cy1,cy2,cx,ok,r,half;
  half=10;
  nx=p.x+dx*sp;
  cy1=Math.floor((p.y-half)/TILE);cy2=Math.floor((p.y+half)/TILE);
  cx=Math.floor((nx+dx*half)/TILE);
  ok=true;for(r=cy1;r<=cy2;r++){if(solid(cx,r)){ok=false;break;}}
  if(ok)p.x=nx;
}
function tryMoveY(p,dy,sp){
  var ny,cx1,cx2,cy,ok,c,half;
  half=10;
  ny=p.y+dy*sp;
  cx1=Math.floor((p.x-half)/TILE);cx2=Math.floor((p.x+half)/TILE);
  cy=Math.floor((ny+dy*half)/TILE);
  ok=true;for(c=cx1;c<=cx2;c++){if(solid(c,cy)){ok=false;break;}}
  if(ok)p.y=ny;
}

function inExplosion(tx,ty){
  if(!inb(tx,ty))return false;
  return F.exp[ty][tx]!==0;
}

function killPlayer(){
  var p=state.player;if(!p.alive)return;
  dirtyPix(p.x,p.y);dirtyPix(p.lx,p.ly);
  p.alive=false;state.lives--;
  if(state.lives<=0){state.over=true;F.full=1;}
  else{p.x=state.spawnX*TILE+16;p.y=state.spawnY*TILE+16;p.inv=90;p.alive=true;p.tx=state.spawnX;p.ty=state.spawnY;p.lx=p.x;p.ly=p.y;F.full=1;}
}

/* Same choice as BOMBERMA (60% forward, else uniform among non-reverse) — no new arrays. */
function pickEnemyDir(e){
  var k,n,fi,idx,m,choice;
  n=0;fi=-1;
  for(k=0;k<4;k++){
    if(walkable(e.tx+F.DX[k],e.ty+F.DY[k])){
      if(F.DX[k]===e.dirx&&F.DY[k]===e.diry)fi=n;
      F.oi[n]=k;n++;
    }
  }
  if(!n)return;
  if(fi>=0&&Math.random()<0.6)choice=F.oi[fi];
  else{
    m=0;
    for(k=0;k<n;k++){
      idx=F.oi[k];
      if(F.DX[idx]!==-e.dirx||F.DY[idx]!==-e.diry){F.oj[m]=idx;m++;}
    }
    if(m)choice=F.oj[rnd(0,m-1)];
    else choice=F.oi[rnd(0,n-1)];
  }
  e.dirx=F.DX[choice];e.diry=F.DY[choice];
  e.tx+=e.dirx;e.ty+=e.diry;
}

function updateEnemies(){
  var i,e,gx,gy,dx,dy,sp;
  sp=1.4+state.level*0.15;
  for(i=0;i<state.enemies.length;i++){
    e=state.enemies[i];
    if(e.dead)continue;
    gx=e.tx*TILE+16;gy=e.ty*TILE+16;
    dx=gx-e.px;dy=gy-e.py;
    if(dx>sp||dx<-sp||dy>sp||dy<-sp){
      e.px+=dx>sp?sp:dx<-sp?-sp:0;
      e.py+=dy>sp?sp:dy<-sp?-sp:0;
      e.animT++;
    }else{
      e.px=gx;e.py=gy;
      pickEnemyDir(e);
    }
  }
}

function near(ax,ay,bx,by,r){var dx=ax-bx,dy=ay-by;return dx*dx+dy*dy<r*r;}

function updatePlayer(){
  var p,sp,dx,dy,j,ptx,pty,i,pu,en;
  p=state.player;if(!p.alive)return;
  p.tx=Math.floor(p.x/TILE);p.ty=Math.floor(p.y/TILE);
  if(p.inv>0)p.inv--;
  sp=2.3;dx=0;dy=0;
  j=stick();
  if(keys.left||(j&4)){dx=-1;p.dir=1;}
  else if(keys.right||(j&8)){dx=1;p.dir=0;}
  else if(keys.up||(j&1)){dy=-1;p.dir=3;}
  else if(keys.down||(j&2)){dy=1;p.dir=2;}
  p.moving=(dx!==0||dy!==0);
  if(p.moving)p.animT++;
  if(dx!==0)tryMoveX(p,dx,sp);
  if(dy!==0)tryMoveY(p,dy,sp);
  if(keys.fire||(j&16))dropBomb();
  ptx=Math.floor(p.x/TILE);pty=Math.floor(p.y/TILE);
  for(i=0;i<state.powerups.length;i++){
    pu=state.powerups[i];
    if(!pu.dead&&pu.tx===ptx&&pu.ty===pty){
      if(pu.type===0)p.bombMax++;else p.bombRange++;
      state.score+=50;pu.dead=true;dirtyTile(ptx,pty);
    }
  }
  if(ptx===state.exitX&&pty===state.exitY&&state.enemiesLeft<=0)state.win=true;
  if(p.inv<=0&&inExplosion(ptx,pty))killPlayer();
  if(p.inv<=0){
    for(i=0;i<state.enemies.length;i++){
      en=state.enemies[i];
      if(!en.dead&&near(p.x,p.y,en.px,en.py,20)){killPlayer();break;}
    }
  }
}

function update(){
  var i,b,en;
  state.tick++;
  for(i=0;i<state.bombs.length;i++){
    b=state.bombs[i];
    if(b.dead)continue;
    b.fuse--;
    if(b.fuse<=0){
      triggerBomb(b);b.dead=true;
      if(state.maze[b.ty][b.tx]===3)state.maze[b.ty][b.tx]=0;
      dirtyTile(b.tx,b.ty);
    }
  }
  for(i=0;i<state.explosions.length;i++){
    b=state.explosions[i];
    if(b.dead)continue;
    b.life--;
    if(b.life<=0){
      b.dead=true;F.exp[b.ty][b.tx]=0;dirtyTile(b.tx,b.ty);
    }
  }
  for(i=0;i<state.enemies.length;i++){
    en=state.enemies[i];
    if(!en.dead&&inExplosion(en.tx,en.ty)){
      en.dead=true;state.score+=100;state.enemiesLeft--;
      dirtyPix(en.px,en.py);dirtyPix(en.lx,en.ly);
    }
  }
  if(!state.over&&!state.win){updatePlayer();updateEnemies();}
}

function blit(idx,x,y,w,h){ctx.drawImage(IMG[idx],0,0,64,64,x|0,y|0,w,h);}

function drawTile(c,r){
  var x,y,v;
  x=c*TILE;y=r*TILE;
  blit(13,x,y,TILE,TILE);
  v=state.maze[r][c];
  if(v===1)blit(9,x,y,TILE,TILE);
  else if(v===2)blit(8,x,y,TILE,TILE);
  if(c===state.exitX&&r===state.exitY)blit(12,x,y,TILE,TILE);
}

function drawMazeFull(){
  var r,c;
  /* BLIT skip-0 cannot restore black holes in wall/floor sheets. */
  ctx.fillStyle="#000000";ctx.fillRect(0,0,640,480);
  for(r=0;r<ROWS;r++){
    for(c=0;c<COLS;c++)drawTile(c,r);
  }
  F.dn=0;F.full=0;
}

function queueMoverDirty(){
  var i,e,p,b;
  p=state.player;
  if(p){dirtyPix(p.lx,p.ly);dirtyPix(p.x,p.y);}
  for(i=0;i<state.enemies.length;i++){
    e=state.enemies[i];
    dirtyPix(e.lx,e.ly);dirtyPix(e.px,e.py);
  }
  /* Bombs pulse size — restore the tile or the previous blit smears. */
  for(i=0;i<state.bombs.length;i++){
    b=state.bombs[i];
    if(!b.dead)dirtyTile(b.tx,b.ty);
  }
}

function flushDrawTiles(){
  var i,c,r;
  ctx.fillStyle="#000000";
  for(i=0;i<F.dn;i++){
    c=F.dc[i];r=F.dr[i];
    ctx.fillRect(c*TILE,r*TILE,TILE,TILE);
    drawTile(c,r);
  }
  F.dn=0;
}

function drawItems(){
  var i,pu,b,bl,ex;
  for(i=0;i<state.powerups.length;i++){
    pu=state.powerups[i];
    if(pu.dead)continue;
    blit(pu.type===0?10:11,pu.tx*TILE,pu.ty*TILE,TILE,TILE);
  }
  for(i=0;i<state.bombs.length;i++){
    b=state.bombs[i];
    if(b.dead)continue;
    bl=(Math.floor(b.fuse/10)%2===0)?0:2;
    blit(6,b.tx*TILE+bl,b.ty*TILE+bl,TILE-bl*2,TILE-bl*2);
  }
  for(i=0;i<state.explosions.length;i++){
    ex=state.explosions[i];
    if(ex.dead)continue;
    blit(7,ex.tx*TILE,ex.ty*TILE,TILE,TILE);
  }
}

function drawMovers(){
  var i,e,ef,p,hide,fr;
  for(i=0;i<state.enemies.length;i++){
    e=state.enemies[i];
    if(e.dead)continue;
    ef=(Math.floor(e.animT/8)%2===0)?4:5;
    blit(ef,e.px-16,e.py-16,TILE,TILE);
    e.lx=e.px;e.ly=e.py;
  }
  p=state.player;
  if(p&&p.alive){
    hide=(p.inv>0&&Math.floor(state.tick/4)%2===0);
    if(!hide){
      if(p.dir===3)fr=3;else if(p.dir===2)fr=2;else fr=(p.moving&&Math.floor(p.animT/6)%2===0)?1:0;
      blit(fr,p.x-16,p.y-16,TILE,TILE);
    }
    p.lx=p.x;p.ly=p.y;
  }
}

function drawHud(){
  var p,msg;
  p=state.player;
  ctx.fillStyle="#000000";ctx.fillRect(0,0,640,26);
  ctx.fillStyle="#ffffff";ctx.font="16px monospace";ctx.textBaseline="middle";
  ctx.fillText("SCORE",10,14);ctx.fillText(state.score,70,14);
  ctx.fillText("LIVES",200,14);ctx.fillText(state.lives,260,14);
  ctx.fillText("BOMBS",330,14);ctx.fillText(p?p.bombMax:0,390,14);
  ctx.fillText("FLAME",460,14);ctx.fillText(p?p.bombRange:0,520,14);
  ctx.fillText("LV",560,14);ctx.fillText(state.level,590,14);
  if(state.over||state.win){
    ctx.fillStyle="#000000";ctx.fillRect(0,180,640,120);
    ctx.fillStyle=state.win?"#88ff88":"#ff6666";ctx.font="32px monospace";
    msg=state.win?"LEVEL CLEAR!":"GAME OVER";
    ctx.fillText(msg,320-msg.length*10,220);
    ctx.fillStyle="#ffffff";ctx.font="16px monospace";
    ctx.fillText("Press R to restart",230,260);
  }else{
    ctx.fillStyle="#ffffee";ctx.font="16px monospace";
    ctx.fillText("Arrows:move  Space:bomb  R:restart",10,470);
  }
}

function draw(){
  if(F.full)drawMazeFull();
  else{queueMoverDirty();flushDrawTiles();}
  drawItems();
  drawMovers();
  drawHud();
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
doReset();
requestAnimationFrame(loop);
})();
</script>
</body>

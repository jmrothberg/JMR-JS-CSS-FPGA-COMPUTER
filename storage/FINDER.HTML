// Chrome-only. Maps the machine's sprite handles to the real PNGs.
// This list is ALSO the art manifest make_artx.py reads — one source of
// truth, so the browser and the .ARTX can never disagree about order.
window.JMR_SPR = ["FINDER-0.png"];
(function () {
  var d = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, "src");
  Object.defineProperty(HTMLImageElement.prototype, "src", {
    get: function () { return d.get.call(this); },
    set: function (v) {
      var m = /^jmr:spr:(\d+)$/.exec(v);
      d.set.call(this, m ? window.JMR_SPR[+m[1]] : v);
    }
  });
})();

}

 n=tbCopyBits(src,dst);if(n<0)return n;
 if(a)tbDamage(x+p[4]+(dx<0?w-a:0),y+p[5],a,h);
 if(b)tbDamage(x+p[4],y+p[5]+(dy<0?h-b:0),w,b);

// END shared scroll_client.js

// Finder program. This is the disk program, the way the 1984 Finder was
// a program and the menu bar stayed in ROM. It is not the built-in
// desktop (functional_model/desktop.py). Folders, positions, Trash, and
// comments live in DESKTOP.FDR. The card stays a flat FAT root.
//
// Arena (bytes). Nothing here is a JS object, so a frame allocates nothing.
// 16384 init, 16385 dirty, 16386 nFiles, 16387 nTrash, 16388 nFolders,
// 16389 nWin, 16390 hidden, 16391 shift, 16392 drag, 16393 dragSlot,
// 16394 front, 16395 buttons, 16396 mx, 16398 my, 16400 pressX, 16402 pressY,
// 16404 lastSlot, 16405 lastFrame, 16407 frame, 16409 renaming, 16410 renameN,
// 16411 rename[12], 16423 renameSlot, 16424 undo, 16425 undoSlot,
// 16426 undoFolder, 16427 undoX, 16429 undoY, 16431 undoN, 16432 undoName[12],
// 16445 deskDirty, 16446 selN, 16447 infoSlot, 16448 prefixN, 16449 prefix[4],
// 16454 prefixFrame, 16456 orderN, 16457 orderWin+1 (0 stale), 16458 icon cache end
// (eighths past 52000). 16460-16470 unused.
// 16600 zoom, 16620 dialog, 16621 clipN, 16622 clip[12], 16634 hostRefresh, 16640 hitWin, 16642 hitSlot.
// 16472 dragX, 16474 dragY: where the icon was when the drag started.
// Slots at 8192 (32 bytes): 22/24 the icon's place (screen on the desktop,
// window content otherwise), 15 flags (1 selected, 2 Trash, 4 keep, 8 locked,
// 16/32 hidden kinds, 64 has a window place). Windows at 16896 (16 bytes, 8

// Names at 30000 and 30100. DESKTOP.FDR name at 30200. Icon name at 30300.
// CARD.SYS name at 30400, its 8 bytes at 30420.
// Alert: sysDocument record at 17152, icon descriptor at 17216, icon at 17280.
// Copy chunk at 45056. 16471 is the Chicago ink (0 black, 1 blue).
// Icon cache: flag at 48000, file scratch at 50000. Runs (32 rows of up
// to 24) packed from 52000, one icon after another; each slot's offset in
// eighths at 49152, the end at 16458. A full cache empties and refills
// from the icons drawn next. 24 runs is the widest icon row.
// The picture is the 1984 Finder (System 1.0): striped title, Disk at the
// upper right, Trash at the lower right, Chicago names. Icons stay the
// color pictures already on the disk. Infinite Mac runs that Finder in
// an emulator; this program draws the same screen.

function ch(c,x,y){

function w16(a,v){

function num(n,x,y){

function bufAt(off,n,x,y){

function labelLen(slot){

function labelWidth(slot){

function labelAt(slot,x,y){
 var i,n,c;
 n=labelLen(slot);

function txt(s,x,y){

}
// Toolbox v1. One call copies or fills a whole arena range.
function copyName(slot,dest){

 a=8192+slot*32;n=stgRead(a);

function isFinder(a){
 if(stgRead(a)<6)return 0;
 if(stgRead(a+1)!=70||stgRead(a+2)!=73||stgRead(a+3)!=78)return 0;
 if(stgRead(a+4)!=68||stgRead(a+5)!=69||stgRead(a+6)!=82)return 0;
 return 1;
}
function kindOf(a){
 var n,i;
 n=stgRead(a);
 if(n>=4&&stgRead(a+n-3)==46&&stgRead(a+n-2)==74&&stgRead(a+n-1)==83&&stgRead(a+n)==72)return 4;
 if(n>=4&&stgRead(a+n-3)==46&&stgRead(a+n-2)==83&&stgRead(a+n-1)==89&&stgRead(a+n)==83)return 4;
 if(n>=4&&stgRead(a+n-3)==46&&stgRead(a+n-2)==73&&stgRead(a+n-1)==67&&stgRead(a+n)==78)return 4;
 if(n>=4&&stgRead(a+n-3)==46&&stgRead(a+n-2)==65&&stgRead(a+n-1)==82&&stgRead(a+n)==84)return 4;
 if(n>=4&&stgRead(a+n-3)==46&&stgRead(a+n-2)==70&&stgRead(a+n-1)==68&&stgRead(a+n)==82)return 5;
 if(n>=4&&stgRead(a+n-3)==46&&stgRead(a+n-2)==72&&stgRead(a+n-1)==84&&stgRead(a+n)==77){
  if(isFinder(a))return 5;

 }
 if(n>=4&&stgRead(a+n-3)==46&&stgRead(a+n-2)==84&&stgRead(a+n-1)==88&&stgRead(a+n)==84)return 2;
 // A document type an application owns (DOCS) is a document, not a sidecar.
 if(docApp(a))return 2;
 if(n>=3&&stgRead(a+n-2)==46&&stgRead(a+n-1)==77&&stgRead(a+n)==68)return 2;
 // A name without an extension is a plain document, not a hidden file.

 return 2;

function flagsFor(a,attr){
 var k,f;
 k=stgRead(a+13);f=0;
 if(k==4)f=16;
 if(k==5)f=32;
 if(attr&1)f=f|8;
 return f;
}
function parseList(){
 var p,n,a,k,c;
 p=256;c=0;
 while(c<250){
  n=stgRead(p);
  if(n==0)break;
  a=8192+c*32;
  stgWrite(a,n);
  tbMove(p+1,a+1,n);
  if(n<12)stgWrite(a+1+n,0);
  p=p+1+n;
  stgWrite(a+16,stgRead(p));stgWrite(a+17,stgRead(p+1));
  stgWrite(a+18,stgRead(p+2));stgWrite(a+19,stgRead(p+3));
  stgWrite(a+20,stgRead(p+4));stgWrite(a+21,stgRead(p+5));
  k=stgRead(p+6);p=p+7;

function stemEq(a,b){
 var i,ca,cb;
 for(i=0;i<8;i++){
  ca=stgRead(a+1+i);cb=stgRead(b+1+i);
  if(ca==46||ca==0)ca=0;
  if(cb==46||cb==0)cb=0;
  if(ca!=cb)return 0;
  if(ca==0)return 1;
 }

}
// A page with a program file of the same stem is an Application (kind 0).
// markKind settles slot s against every other slot, from either side.
function markKind(s){
 var j,n,a,b,k;
 n=stgRead(16386);a=8192+s*32;k=stgRead(a+13);
 for(j=0;j<n;j++){
  b=8192+j*32;
  if(k==1&&stgRead(b+13)==4&&stemEq(a,b))stgWrite(a+13,0);
  if(k==4&&stgRead(b+13)==1&&stemEq(a,b))stgWrite(b+13,0);
 }
}
function markKinds(){
 var i,n;
 n=stgRead(16386);
 for(i=0;i<n;i++)if(stgRead(8192+i*32+13)==1)markKind(i);
}
// Directory and slot order mostly agree, so the search starts at hint.
function findName(off,nlen,filesOnly,hint){
 var i,k,a,n,j;
 n=stgRead(16386);
 for(k=0;k<n;k++){
  i=(hint+k)%n;a=8192+i*32;
  if(filesOnly&&stgRead(a+13)==6)continue;
  if(stgRead(a)!=nlen)continue;
  j=0;while(j<nlen&&stgRead(a+1+j)==stgRead(off+j))j=j+1;
  if(j==nlen)return i;
 }

}
function allocSlot(){
 var i,n,a;
 n=stgRead(16386);
 for(i=0;i<n;i++){
  a=8192+i*32;
  if(stgRead(a)==0)return i;
 }
 if(n>=250)return -1;
 stgWrite(16386,n+1);

}
// Every return from a program, and every host import, merges the card's
// directory without renumbering folder/window slots: sizes and dates are
// updated, new files get a slot. DESKTOP.FDR is written only when a new
// file was placed; icons are reread only after an import.
function refreshHostCatalog(){
 var p=256,n,s,a,count=0,hint=0;
 if(fsList()<0)return;
 readCard();
 while(count<250){
  n=stgRead(p);if(n==0)break;if(n>12)return;
  s=findName(p+1,n,1,hint);
  if(s<0){
   s=allocSlot();
   if(s>=0){
    a=8192+s*32;tbFill(a,0,32);stgWrite(24576+s*24,0);stgWrite(48000+s,0);
    stgWrite(a,n);tbMove(p+1,a+1,n);
    stgWrite(a+13,kindOf(a));stgWrite(a+15,flagsFor(a,stgRead(p+7+n)));markKind(s);
   }
  }
  if(s>=0){tbMove(p+1+n,8192+s*32+16,6);hint=s+1;}
  p=p+n+8;count=count+1;
 }
 if(stgRead(16634))tbFill(48000,0,256);
 placeGrid();recount();saveDesk();
 stgWrite(16634,0);
}
// CARD.SYS, written by the card builder: data clusters and bytes per
// cluster of the FAT the card was made with. Without it, no free space.
var cardK=0,clusterB=4096,usedCl=0;
function readCard(){
 var i;
 for(i=0;i<8;i++)stgWrite(30400+i,strByte("CARD.SYS",i));stgWrite(30408,0);
 cardK=0;
 if(fsRead(30400,0,30420,8)==8&&rd32(30424)>0){clusterB=rd32(30424);cardK=Math.floor(rd32(30420)*clusterB/1024);}
}
function recount(){
 var i,n,t,f,a;
 n=stgRead(16386);t=0;f=0;
 // The root directory: one 32-byte entry per file.
 usedCl=1+Math.floor(n*32/clusterB);
 for(i=0;i<n;i++){
  a=8192+i*32;
  if(stgRead(a)==0)continue;
  if(stgRead(a+13)!=6)usedCl=usedCl+Math.ceil(rd32(a+16)/clusterB);
  if(stgRead(a+15)&2)t=t+1;
  if(stgRead(a+13)==6)f=f+1;
 }
 // The Trash picture is empty or full: repaint it when that changes.
 if((stgRead(16387)>0)!=(t>0))tbDamage(574,398,46,52);
 stgWrite(16387,t);stgWrite(16388,f);stgWrite(16457,0);
}
// Icons keep their own places in a window (slot 22/24, from the window's
// content corner; flag 64). Removing one moves no other. A file without a
// place takes the first free cell of the 5-column grid in its folder.
function placeGrid(){
 var i,n,a,fl;
 n=stgRead(16386);WM.cell=0;
 for(i=0;i<n;i++){
  a=8192+i*32;fl=stgRead(a+15);
  if(stgRead(a)==0||(fl&96)||stgRead(a+14)==255)continue;
  // Hidden files get a place only while Hidden files is checked.
  if(((fl&16)||stgRead(a+13)==3)&&!stgRead(16390))continue;
  if(WM.fold!=(fl&2?256:stgRead(a+14)))WM.cell=0;WM.fold=fl&2?256:stgRead(a+14);
  freeCell(i);stgWrite(a+15,fl|68);stgWrite(16445,1);
 }
}
// 1 when another placed icon in the same folder (or both in the Trash)
// sits within half a cell of slot s. Hidden files hold no cell while hidden.
function taken(s){
 var i,a,b=8192+s*32,t=stgRead(b+15)&2,hid=stgRead(16390);
 for(i=0;i<stgRead(16386);i++){
  a=8192+i*32;
  if(!hid&&((stgRead(a+15)&16)||stgRead(a+13)==3))continue;
  if(i!=s&&stgRead(a)&&(stgRead(a+15)&64)&&(stgRead(a+15)&2)==t&&(t||stgRead(a+14)==stgRead(b+14))&&Math.abs(r16(a+22)-r16(b+22))<51&&Math.abs(r16(a+24)-r16(b+24))<43)return 1;
 }

}
// WM.cell: where the last search in folder WM.fold ended, so a cold disk
// places a folder's icons in one pass.
function freeCell(s){
 var c=WM.cell,a=8192+s*32;
 while(c<1000){w16(a+22,36+c%5*102);w16(a+24,10+Math.floor(c/5)*86);if(!taken(s))break;c=c+1;}

}
function initNames(){
 stgWrite(30200,68);stgWrite(30201,69);stgWrite(30202,83);stgWrite(30203,75);
 stgWrite(30204,84);stgWrite(30205,79);stgWrite(30206,80);stgWrite(30207,46);
 stgWrite(30208,70);stgWrite(30209,68);stgWrite(30210,82);stgWrite(30211,0);
}
function allocFolder(off,nl){
 var s,a;
 s=allocSlot();if(s<0)return -1;
 a=8192+s*32;stgWrite(a,nl);
 tbMove(off,a+1,nl);

}
function applyRec(s,p,nl){
 var a,b,cl,fl;
 a=8192+s*32;b=p+1+nl;
 stgWrite(a+14,stgRead(b));
 stgWrite(a+22,stgRead(b+1));stgWrite(a+23,stgRead(b+2));
 stgWrite(a+24,stgRead(b+3));stgWrite(a+25,stgRead(b+4));

function applyDesk(){
 var i,n,p,c,s,nl,cl;
 // Do not bring saved windows back. A Trash window saved in front
 // covered the disk. File positions still come from the records below.
 tbFill(16896,0,128);
 c=stgRead(32914)+stgRead(32915)*256;p=32916;s=-1;

 if(n<4)return;

function keepSlot(i){
 var a,k,fl;
 a=8192+i*32;
 if(stgRead(a)==0)return 0;
 k=stgRead(a+13);fl=stgRead(a+15);

 if(k==6||(fl&2)||(fl&4))return 1;

function writeRec(i,p){
 var a,n,cl;
 a=8192+i*32;n=stgRead(a);
 stgWrite(p,n);p=p+1;
 tbMove(a+1,p,n);p=p+n;
 stgWrite(p,stgRead(a+14));p=p+1;
 stgWrite(p,stgRead(a+22));p=p+1;
 stgWrite(p,stgRead(a+23));p=p+1;

function saveDesk(){
 var i,n,p,c;
 if(stgRead(16445)==0)return;

 tbBox(220,272,100,26,255);tbText([67,97,110,99,101,108],270-tbTextWidth([67,97,110,99,101,108])/2,277);
 okButton();
}
// Character codes for tbText, built without string concatenation.
function addText(t,s){var i=0;while(strByte(s,i)>=0){t.push(strByte(s,i));i=i+1;}return t;}
function addNum(t,n){var d=1;n=Math.floor(n);while(d*10<=n)d=d*10;while(d>0){t.push(48+Math.floor(n/d)%10);d=Math.floor(d/10);}return t;}
// About: the Enterprise, then the name and line centred, and OK. The ship is a
// stencil in FINDER-0.png at 0,64 (tools/make_finder_about_art.py) over black.
// The Toolbox About strings are not visible to a client, so they live here.
function drawAbout(){
 var t;
 alertFrame(0);ctx.fillRect(200,134,240,62);ctx.drawImage(fontImage,0,64,240,62,200,134,240,62);
 t=tbSessionCodes("JMR's Enterprise Finder");tbText(t,320-tbTextWidth(t)/2,208);
 t=tbSessionCodes("Manage programs and documents.");tbText(t,320-tbTextWidth(t)/2,234);okButton();
}
// The alert frame and a SYSTEM.SYS icon (23776 bomb, 23904 caution; 0 none).
function alertFrame(icon){
 tbBox(136,112,368,200,255);tbBox(139,115,362,194,255);
 if(icon&&tbResources(icon,17280,128)==128){
  tbSurface(17216,17280,32,32,4,1);stgWrite(17218,1);tbInk(17216,0,255);
  tbPlaceScreen(17216,160,136,1);tbBlit(17216);
 }
 tbInk(_tbD,0,1);
}
function okButton(){tbBox(337,269,98,32,255);tbBox(340,272,92,26,255);tbText([79,75],386-tbTextWidth([79,75])/2,277);}
function drawReceiving(){
 tbBox(160,178,320,104,255);tbBox(163,181,314,98,255);
 tbInk(_tbD,0,1);
 tbText([82,101,99,101,105,118,105,110,103,32,102,105,108,101,115],210,208);
 tbText([80,108,101,97,115,101,32,119,97,105,116],232,240);
}
// Why the last program stopped: sysDocument(0) byte 19, read once per run.
// 0 normal, 1-31 the loader refused the file, 128+n VM fault n.
var exitStatus=-1;
function readExitStatus(){
 exitStatus=0;
 if(sysDocument(0,17152,0)>=0)exitStatus=stgRead(17171);
 if(exitStatus){WM.bounded=0;stgWrite(16385,1);}
}
function closeAlert(){exitStatus=0;WM.bounded=0;stgWrite(16385,1);}
function alertReason(s){
 if(s==64)return "No program here reads this type.";
 if(s==6)return "The file was not found.";
 if(s==7)return "It is not a program.";
 if(s==9)return "Its program file is missing.";
 if(s==14)return "It did not compile.";
 if(s==10||s==15)return "It is too large.";
 if(s==16)return "The file is damaged.";
 if(s==4)return "The disk could not be read.";
 return "It could not be loaded.";
}
// The System Error box and the load alert. Same frame and button as the
// Toolbox dialogs; the icon is SYSTEM.SYS alert icon 0 (bomb) or 1 (caution).
function drawAlert(){
 var bomb;
 if(exitStatus<=0)return;
 bomb=exitStatus>=128;
 alertFrame(bomb?23776:23904);
 if(bomb){
  tbText(tbSessionCodes("Sorry, a system error occurred."),208,140);
  tbText(addNum([73,68,32,61,32],exitStatus-128),208,172);
 }else{
  tbText(tbSessionCodes(exitStatus==64?"The file could not be opened.":"The application could not be opened."),208,140);
  tbText(tbSessionCodes(alertReason(exitStatus)),208,172);
 }
 okButton();
}
function paint(){
 var p,w,h;stgWrite(16385,0);
 if(stgRead(16600))zoomStep(1);
 if(!WM.bounded)tbDamage(0,22,640,458);tbDamageClip();p=tbDrawBounds(0,22,640,458);
 w=p[2]-p[0];h=p[3]-p[1];
 if(w>0&&h>0){
  // The desktop gray in one patterned copy: even rows 91, odd rows 123.
  tbScreen(17024);tbRect(17024,0,0,w,h);tbPair32(17064,16711935,16711935);tbInk(17024,91,123);stgWrite(17061,2);
  tbScreen(17088);tbRect(17088,0,0,w,h);tbPlace(17088,p[0],p[1],1);tbRaster(17024,17088,0);
 }
 drawDesk();drawWindows();drawDrag();drawDialog();drawAlert();tbPortPop();tbDamageClear();WM.bounded=0;menuMask();
}
// The first frame back from another program: windows, typed prefix, and
// the card directory (the program may have saved a file).
function resume(){
 if(WM.restored||!stgRead(16384))return;
 WM.restored=1;wmRestore();stgWrite(16448,0);stgWrite(16600,0);
 refreshHostCatalog();WM.bounded=0;stgWrite(16385,1);
}
function start(){
 var i;
 // Cold DDR memory is undefined, and the compiler/tools share this arena.
 // Initialize every metadata owner before reading flags or window geometry.
 // Resident returns keep init=1 and bypass start(), preserving their state.
 for(i=8192;i<17024;i++)stgWrite(i,0);
 for(i=0;i<256;i++){
  stgWrite(24576+i*24,0); // empty comment; payload ignored until a length is set
  stgWrite(48000+i,0);   // icon cache invalid; pixels are loaded on demand
 }
 stgWrite(16404,255); // No previous click on a cold desktop.
 ctx.font="8px";ctx.fillStyle="#000000";
 initNames();readCard();fsList();parseList();markKinds();loadDesk();placeGrid();recount();
 if(haveDisk()==0)openWin(0,0,8,34,548,354,0);
 pickFront();menuMask();
 WM.restored=1;stgWrite(16384,1);stgWrite(16385,1);
}
function frame(){
 var f;
 if(WM.receiving==2){WM.receiving=0;sysRun(30200,8);return;}
 if(exitStatus<0)readExitStatus();
 f=r16(16407)+1;w16(16407,f);
 if(stgRead(16448)>0&&f-r16(16454)>40)stgWrite(16448,0);
 if(stgRead(16409)&&f%16==0&&!stgRead(16385)){itemDamage(stgRead(16423));WM.bounded=1;stgWrite(16385,1);}
 if(stgRead(16384)==0)start();
 else{if(!WM.restored)resume();repScroll();if(stgRead(16600))zoomStep(0);else if(stgRead(16385))paint();}
 if(WM.receiving==1){drawReceiving();WM.receiving=2;}
 tbSessionFrame(frame);
}
tbSessionListen("keydown",onKey);
tbSessionListen("keyup",onKeyUp);
tbSessionListen("mousedown",onDown);
tbSessionListen("mousemove",onMove);
tbSessionListen("mouseup",onUp);
tbSessionFrame(frame);

tbSessionProgram('FINDER.HTM');
tbSessionInvalidate(function(){if(stgRead(16384)){resume();paint();}});

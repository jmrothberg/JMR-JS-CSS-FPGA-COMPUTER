<!doctype html>
<!-- jmr-toolbox: resident-v2 -->
<!-- Shared native-JavaScript Toolbox example: session menus and dialogs.
     File > Quit and Esc come from the session. -->
<html><head><title>Toolbox Demo</title></head><body><canvas width="640" height="480"></canvas>
<script>
var c=document.querySelector("canvas").getContext("2d");
tbSessionProperty(c,0,6);
tbSessionProperty(c,2,"Toolbox Demo|Shared menus and dialogs in native|JavaScript: alerts, choices and names.");
tbSessionMenus(c,"Demo|Choose title...=160|Name title...=161");
var choices=[tbSessionCodes("Note"),tbSessionCodes("Picture"),tbSessionCodes("Letter"),tbSessionCodes("List"),
 tbSessionCodes("Sketch"),tbSessionCodes("Memo"),tbSessionCodes("Drawing")];
var title=tbSessionCodes("Toolbox"),kind=0,redraw=1;
function paint(){
 c.fillStyle="#FFF";c.fillRect(24,88,576,344);
 tbText(tbSessionCodes("Shared menus and dialogs"),48,112);
 tbText(tbSessionCodes("Native JavaScript"),48,136);
 tbText(title,48,166);
 redraw=0;
}
// Dialog results come back through the document callback; Quit continues.
tbSessionDocument(function(action,value){
 if(action==4){tbDocumentContinue(value);return 1;}
 if(action!=5||!kind)return 0;
 if(value==1)title=kind==2?tbDialogValue():choices[tbDialogSelection()];
 kind=0;redraw=1;return 1;
});
tbSessionListen("keydown",function(e){
 if(e.keyCode==160){kind=1;tbDialogOpen(4,tbSessionCodes("Choose a title"),choices,[]);}
 if(e.keyCode==161){kind=2;tbDialogOpen(3,tbSessionCodes("Name the title"),[],[]);}
});
function frame(){
 if(redraw)paint();
 tbSessionFrame(frame);
}
tbSessionFrame(frame);
tbSessionInvalidate(paint);
tbSessionProgram('TBDEMO.HTM');
</script></body></html>

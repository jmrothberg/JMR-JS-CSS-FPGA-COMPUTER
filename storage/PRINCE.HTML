/* PRINCE — a Prince of Persia style dungeon crawl for this machine.

   All 12 levels are transcribed from the Apple II original's LEVEL1-LEVEL12
   files (Jordan Mechner's open-source release): each level is 24 rooms of
   10x3 tiles, the room links, the guard placement and the plate -> gate
   wiring (decoded from LINKLOC/LINKMAP, the BUILDER.S encoding: BlueSpec of
   a plate points at its first LINKLOC entry, bit 7 marks the last). The
   exit door advances to the next level. Level 1's rooms are those pieces
   painted with his Macintosh brick; the spikes, gates, torches, potions,
   doors, sword and bones are the Macintosh frames of those objects. Later
   levels are drawn from one shared set of those same cells. The prince and
   the guard are his Macintosh paintings of those poses
   (artwork/Persia(COLOR)), scaled onto the Apple II feet.
   tools/make_prince_art.py builds the four sheets.

   One room is 280x192 hi-res pixels, drawn at 2x (560x384) with a 40-pixel
   margin. A block is 28x63 source pixels, so 56x126 on screen, and the feet
   stand 20 pixels above the bottom of the block (VertDist 10, times 2).
   Walking off an edge follows the room link on that side. Run, jump, grab
   ledges (hold Z or Up),
   climb, find the sword, beat the guard, open the exit door. 60 minutes.

   Keys: Left/Right run   Up jump / climb up   Down crouch / climb down
   Z careful step / grab   Space sword   H help for this room
   Enter start   Esc is BREAK. */

/* Playfield is the Apple II screen at 2x, centred. A block is 56x126 and
   the walk line (FLOOR0, then +FH per row) is 20px above the block bottom. */
var OX = 40, OY = 48, TW = 56, FH = 126, ROOMH = 378;
var RY = 48;
var FLOOR0 = 158;
var KIDH = 96;              /* body height for head checks */

var WMAP = [];              /* 72 row arrays: working copy of the level */
var M0, M1, M2;             /* rows of the current room */
var ROOM = 0;

var MODE = 0;               /* 0 title, 1 play, 2 dying, 3 level clear, 4 time up */
var LV = 1;                 /* 1..12, and 13 once the last door closes */
var FRAME = 0;
var TL = 0;                 /* frames left on the hourglass */
var HEARTS = 3;
var SWORD = 0;
var MSG = "", MSGT = 0;
var HELPON = 0;             /* 1 while H is showing this room's hint */

var X = 96, Y = 184, VX = 0, VY = 0;
var FACE = -1, POSE = 0, ANIM = 0;
var GROUND = 1, HANG = 0, CLIMB = 0, CROUCH = 0, JUMPL = 0;
var HANY = 0;               /* hang: surface height */
var FALLY = 0;              /* y where the current fall began */
var ATTACK = 0, HURT = 0, DEADT = 0, PLATE = -1;

var GX = 0, GY = 0, GFACE = -1, GPOSE = 0, GHP = 3, GDEAD = 0;
var GSTATE = 0, GT = 0, GAT = 0;
var GCUR = -1;              /* which guard in this room, or -1 */
var GN = 0, GOFF = 0, PN = 0, POFF = 0, LOFF = 0;
var KSCR = 1, KBLK = 0, KFAC = 0;
var GSR = [], GXX = [], GYY = [], GXF = [], GHH = [], GDD = [];
var ORIG = [];              /* level tiles before gates and floors change */

var LSR = [], LSC = [], LST = [], LSN = 0;

var KL = 0, KR = 0, KU = 0, KD = 0, KC = 0;

/* Tiles whose picture changes (gate, potion, loose floor, door, sword).
   Filled by buildPatches in the same order make_prince_art.py crops them. */
var PATCH = [];
var NPATCH = 0;

/* ------------------------------------------------------ map helpers -- */
function tileAt(r, c) {
  if (c < 0 || c > 9) { return T_BLOCK; }
  if (r < 0 || r > 2) { return T_AIR; }
  if (r === 0) { return M0[c]; }
  if (r === 1) { return M1[c]; }
  return M2[c];
}
/* Solid blocks the body. Torches, posts, panels, bones and arches are decor
   you walk through; only the block mass, big pillars and shut gates/doors
   stop you. */
function solidT(t) {
  return t === T_GATE || t === T_BPILB || t === T_BPILT || t === T_DOORL ||
         t === T_DOORR || t === T_BLOCK || (t >= 26 && t <= 29);
}
/* Standable tiles hold your weight (surface at the tile's bottom edge).
   Opened gates and the opened exit door become floor. */
function standT(t) {
  return t === T_FLOOR || t === T_SPIKE || t === T_POSTS || t === T_PLATEX ||
         t === T_PLATEDN || t === T_POTION || t === T_LOOSE || t === T_DEBRIS ||
         t === T_PLATEUP || t === T_BONES || t === T_SWORD || t === 25 ||
         t === T_GATE_O || t === T_DOORL_O || t === T_DOORR_O;
}
function rowOf(y) { return Math.floor((y - (FLOOR0 - FH) - 0.01) / FH); }
function colOf(x) { return Math.floor((x - OX) / TW); }

/* First standing surface at or below y in the column holding x. A surface
   sits at the bottom of a row whose tile is standable, or on top of a solid
   tile (= the bottom of the row above it). */
function supportBelow(x, y) {
  var c = colOf(x);
  var r = rowOf(y);
  if (r < 0) { r = 0; }
  while (r <= 2) {
    if (standT(tileAt(r, c))) { return FLOOR0 + r * FH; }
    if (r < 2 && solidT(tileAt(r + 1, c))) { return FLOOR0 + r * FH; }
    r = r + 1;
  }
  return FLOOR0 + 2 * FH + 80;   /* no floor: fall out of the room */
}

function pointSolid(px, py) {
  return solidT(tileAt(rowOf(py), colOf(px)));
}
/* Body is 16 wide, KIDH tall, feet at y. */
function bodyHits(nx, y) {
  if (pointSolid(nx - 7, y - 8)) { return 1; }
  if (pointSolid(nx + 7, y - 8)) { return 1; }
  if (pointSolid(nx - 7, y - 50)) { return 1; }
  if (pointSolid(nx + 7, y - 50)) { return 1; }
  if (pointSolid(nx - 7, y - 92)) { return 1; }
  if (pointSolid(nx + 7, y - 92)) { return 1; }
  return 0;
}

function adjRoom(side) {
  var b = strByte(LVL[LV - 1], LOFF + ROOM * 4 + side);
  if (b === 46) { return -1; }
  return b - 65;
}

function setRoom(n) {
  saveGuard();
  ROOM = n;
  M0 = WMAP[n * 3];
  M1 = WMAP[n * 3 + 1];
  M2 = WMAP[n * 3 + 2];
  LSN = 0;
  GCUR = -1;
}

/* Read one packed level: runs of tiles, 96 link chars, the kid, the guards,
   the plates. Char 48 is value 0. */
function unpack() {
  var s, runs, i, p, t, c, n, k, row;
  s = LV - 1;
  runs = (strByte(LVL[s], 0) - 48) * 20 + (strByte(LVL[s], 1) - 48);
  p = 2;
  n = 0;
  i = 0;
  while (i < 72) {
    WMAP[i] = [];
    if (!ORIG[i]) { ORIG[i] = []; }
    i = i + 1;
  }
  i = 0;
  while (i < runs) {
    t = strByte(LVL[s], p) - 48;
    c = strByte(LVL[s], p + 1) - 48;
    p = p + 2;
    k = 0;
    while (k < c) {
      row = Math.floor(n / 10);
      WMAP[row][n % 10] = t;
      ORIG[row][n % 10] = t;
      n = n + 1;
      k = k + 1;
    }
    i = i + 1;
  }
  LOFF = p;
  p = p + 96;
  KSCR = strByte(LVL[s], p) - 48;
  KBLK = strByte(LVL[s], p + 1) - 48;
  KFAC = strByte(LVL[s], p + 2) - 48;
  p = p + 3;
  GN = strByte(LVL[s], p) - 48;
  GOFF = p + 1;
  p = GOFF + GN * 3;
  PN = strByte(LVL[s], p) - 48;
  POFF = p + 1;
}

function placeGuards() {
  var i, b, p;
  GCUR = -1;
  GDEAD = 1;
  i = 0;
  while (i < GN) {
    p = GOFF + i * 3;
    GSR[i] = strByte(LVL[LV - 1], p) - 48;
    b = strByte(LVL[LV - 1], p + 1) - 48;
    GXF[i] = (strByte(LVL[LV - 1], p + 2) - 48) === 0 ? -1 : 1;
    GXX[i] = OX + (b % 10) * TW + TW / 2;
    GYY[i] = FLOOR0 + Math.floor(b / 10) * FH;
    GHH[i] = 3;
    GDD[i] = 0;
    i = i + 1;
  }
}

/* The guard who lives in this room, if there is one. */
function bindGuard() {
  var i;
  i = 0;
  while (i < GN) {
    if (GSR[i] === ROOM) {
      if (GCUR !== i) {
        GCUR = i;
        GX = GXX[i];
        GY = GYY[i];
        GFACE = GXF[i];
        GHP = GHH[i];
        GDEAD = GDD[i];
        GSTATE = 0;
        GT = 0;
        GAT = 0;
        GPOSE = GDEAD === 1 ? 6 : 0;
      }
      return;
    }
    i = i + 1;
  }
  GCUR = -1;
  GDEAD = 1;
}

function saveGuard() {
  if (GCUR < 0) { return; }
  GXX[GCUR] = GX;
  GYY[GCUR] = GY;
  GXF[GCUR] = GFACE;
  GHH[GCUR] = GHP;
  GDD[GCUR] = GDEAD;
}

/* -------------------------------------------------------- level setup -- */
function loadLevel() {
  unpack();
  SWORD = 0;
  placeGuards();
  respawn();
}
function respawn() {
  var col, row;
  col = KBLK % 10;
  row = Math.floor(KBLK / 10);
  setRoom(KSCR - 1);
  X = OX + col * TW + TW / 2;
  Y = FLOOR0 + row * FH;
  VX = 0;
  VY = 0;
  FACE = KFAC === 0 ? -1 : 1;
  POSE = 0;
  GROUND = 0;
  FALLY = Y;
  HANG = 0;
  CLIMB = 0;
  CROUCH = 0;
  ATTACK = 0;
  HURT = 0;
  PLATE = -1;
}
function startGame() {
  LV = 1;
  HEARTS = 3;
  TL = 3600 * 60;
  loadLevel();
  say("LEVEL 1 - THE DUNGEON");
  MODE = 1;
}
function nextLevel() {
  loadLevel();
  say("THE NEXT LEVEL");
  MODE = 1;
}
function say(m) {
  MSG = m;
  MSGT = 150;
}

/* ------------------------------------------------------------ plates -- */
function runEvents() {
  var tile = rowOf(Y) * 10 + colOf(X), i, kind, tr, tt, tc, p;
  for (i = 0; i < PN; i = i + 1) {
    p = POFF + i * 5;
    if ((strByte(LVL[LV - 1], p) - 48) === ROOM && (strByte(LVL[LV - 1], p + 1) - 48) === tile) {
      kind = strByte(LVL[LV - 1], p + 2) - 48;
      tr = strByte(LVL[LV - 1], p + 3) - 48;
      tt = strByte(LVL[LV - 1], p + 4) - 48;
      tc = WMAP[tr * 3 + Math.floor(tt / 10)];
      if (kind === 0) {
        if (tc[tt % 10] === T_GATE) { tc[tt % 10] = T_GATE_O; playSfx(sfxGate); }
        if (tc[tt % 10] === T_DOORL) {
          tc[tt % 10] = T_DOORL_O;
          WMAP[tr * 3 + Math.floor((tt + 1) / 10)][(tt + 1) % 10] = T_DOORR_O;
          playSfx(sfxGate);
          say("THE EXIT DOOR IS OPEN");
        }
      } else {
        if (tc[tt % 10] === T_GATE_O) { tc[tt % 10] = T_GATE; playSfx(sfxGate); }
      }
    }
  }
}

/* What the kid stands on: plates, potions, the sword, loose floors. */
function stepOn() {
  var r = rowOf(Y), c = colOf(X), t = tileAt(r, c), row;
  if (t === T_PLATEUP || t === T_PLATEDN) {
    if (PLATE !== r * 10 + c) {
      PLATE = r * 10 + c;
      playSfx(sfxPlate);
      runEvents();
    }
    return;
  }
  PLATE = -1;
  if (t === T_POTION) {
    row = r === 0 ? M0 : (r === 1 ? M1 : M2);
    row[c] = T_FLOOR;
    if (HEARTS < 5) { HEARTS = HEARTS + 1; }
    playSfx(sfxPotion);
    say("A POTION! STRENGTH RETURNS");
    return;
  }
  if (t === T_SWORD) {
    row = r === 0 ? M0 : (r === 1 ? M1 : M2);
    row[c] = T_FLOOR;
    SWORD = 1;
    playSfx(sfxSword);
    say("YOU FOUND THE SWORD");
    return;
  }
  if (t === T_LOOSE) {
    startLoose(r, c);
  }
}

/* ------------------------------------------------------------ loose -- */
function startLoose(r, c) {
  var i;
  for (i = 0; i < LSN; i++) {
    if (LSR[i] === r && LSC[i] === c) { return; }
  }
  if (LSN >= 8) { return; }
  LSR[LSN] = r;
  LSC[LSN] = c;
  LST[LSN] = 40;
  LSN = LSN + 1;
}
function updateLoose() {
  var i, n = 0;
  for (i = 0; i < LSN; i++) {
    LST[i] = LST[i] - 1;
    if (LST[i] <= 0) {
      if (LSR[i] === 0) { M0[LSC[i]] = T_AIR; }
      else if (LSR[i] === 1) { M1[LSC[i]] = T_AIR; }
      else { M2[LSC[i]] = T_AIR; }
      playSfx(sfxLoose);
    } else {
      LSR[n] = LSR[i];
      LSC[n] = LSC[i];
      LST[n] = LST[i];
      n = n + 1;
    }
  }
  LSN = n;
}

/* ------------------------------------------------------------- death -- */
function killKid() {
  if (MODE !== 1) { return; }
  MODE = 2;
  DEADT = 90;
  POSE = 14;
  HANG = 0;
  CLIMB = 0;
  playSfx(sfxDie);
}

/* -------------------------------------------------------------- guard -- */
function updateGuard() {
  var d, ad, nx;
  bindGuard();
  if (GCUR < 0 || GDEAD === 1) { return; }
  if (GY - Y > 40 || Y - GY > 40) { GPOSE = 0; return; }
  d = X - GX;
  ad = d < 0 ? -d : d;
  if (GSTATE === 1) {           /* windup */
    GPOSE = 4;
    GT = GT - 1;
    if (GT <= 0) { GSTATE = 2; GT = 10; }
    return;
  }
  if (GSTATE === 2) {           /* strike lands early in the swing */
    GPOSE = 3;
    GT = GT - 1;
    if (GT === 6 && ad < 64) {
      if (ATTACK > 2) { playSfx(sfxClang); }
      else {
        HEARTS = HEARTS - 1;
        HURT = 30;
        X = X + (d < 0 ? -20 : 20);
        playSfx(sfxHit);
        if (HEARTS <= 0) { killKid(); return; }
      }
    }
    if (GT <= 0) { GSTATE = 0; GAT = FRAME + 40; }
    return;
  }
  GFACE = d < 0 ? -1 : 1;
  if (ad > 52) {
    nx = GX + (d < 0 ? -1.1 : 1.1);
    if (!bodyHitsAt(nx, GY)) { GX = nx; }
    GPOSE = 1 + (Math.floor(FRAME / 10) % 2);
  } else {
    GPOSE = 0;
    if (FRAME >= GAT) { GSTATE = 1; GT = 14; }
  }
}
function bodyHitsAt(nx, y) {
  return bodyHits(nx, y);
}
/* The kid's sword lands. */
function resolveAttack() {
  var d;
  if (ATTACK !== 8 || SWORD !== 1) { return; }
  bindGuard();
  if (GCUR < 0 || GDEAD === 1) { return; }
  d = GX - X;
  if (d < 0) { d = -d; }
  if (d > 62 || GY - Y > 40 || Y - GY > 40) { return; }
  GHP = GHP - 1;
  playSfx(sfxClang);
  if (GHP <= 0) {
    GDEAD = 1;
    GPOSE = 6;
    say("THE GUARD FALLS");
  } else {
    GX = GX + (GFACE * 22);
    GPOSE = 5;
    GSTATE = 0;
    GAT = FRAME + 50;
  }
  saveGuard();
}

/* ---------------------------------------------------------------- kid -- */
function grabLedge() {
  var gx, c, b;
  if (VY <= 0 || HANG === 1) { return; }
  if (KC !== 1 && KU !== 1) { return; }
  gx = X + FACE * 14;
  c = colOf(gx);
  b = supportBelow(c * TW + 32, Y - 84);
  if (b - (Y - 88) >= -2 && b - (Y - 88) <= 18) {
    if (bodyHits(c * TW + 32, b)) { return; }
    HANG = 1;
    HANY = b;
    X = c * TW + 32;
    Y = b;
    VY = 0;
    VX = 0;
    POSE = 7;
    playSfx(sfxGrab);
  }
}

function startClimbDown() {
  var ahead = supportBelow(X + FACE * 20, Y);
  if (ahead <= Y + 4) { return 0; }         /* no drop ahead: just crouch */
  FACE = -FACE;
  HANY = Y;
  HANG = 1;
  GROUND = 0;
  X = X - FACE * 6;
  POSE = 7;
  return 1;
}

function updateKid() {
  var nx, ny, sup, spd, j, r, c, t;
  if (HURT > 0) { HURT = HURT - 1; }
  if (ATTACK > 0) { ATTACK = ATTACK - 1; }

  j = joy();
  if ((j & 4) !== 0) { KL = 1; }
  if ((j & 8) !== 0) { KR = 1; }
  if ((j & 1) !== 0) { KU = 1; }
  if ((j & 2) !== 0) { KD = 1; }

  if (HANG === 1) {
    POSE = 7;
    if (KU === 1) {
      KU = 0;
      HANG = 0;
      CLIMB = 22;
      GROUND = 0;
    } else if (KD === 1) {
      KD = 0;
      HANG = 0;
      GROUND = 0;
      VY = 1;
      FALLY = Y;
    }
    return;
  }
  if (CLIMB > 0) {
    CLIMB = CLIMB - 1;
    POSE = CLIMB > 11 ? 8 : 9;
    if (CLIMB <= 0) {
      Y = HANY;
      GROUND = 1;
      POSE = 0;
      stepOn();
    }
    return;
  }

  /* crouch, or climb down at an edge */
  if (GROUND === 1 && KD === 1) {
    if (startClimbDown() === 1) { return; }
    CROUCH = 1;
    POSE = 10;
    VX = 0;
    return;
  }
  CROUCH = 0;

  /* 56px blocks (was 64), so a step crosses a block in the same time */
  spd = KC === 1 ? 1.1 : 3.5;
  if (KL === 1) { VX = -spd; FACE = -1; }
  else if (KR === 1) { VX = spd; FACE = 1; }
  else { VX = 0; }

  if (GROUND === 1 && VX !== 0) {
    /* careful steps refuse to walk off an edge */
    if (KC === 1 && supportBelow(X + VX * 10, Y) > Y + 4) {
      VX = 0;
      POSE = 11;
    } else {
      ANIM = ANIM + 1;
      POSE = KC === 1 ? 11 : 1 + (Math.floor(ANIM / 4) % 4);
    }
  } else if (GROUND === 1) {
    POSE = SWORD === 1 ? 15 : 0;
    ANIM = 0;
  }

  /* Jump on the Up edge; the held key stays live so grabLedge can see it
     (hold Up to grab, exactly like the original). */
  if (KU === 1 && GROUND === 1 && JUMPL === 0) {
    JUMPL = 1;
    /* floors are 126 apart; this still crests a bit over half a floor */
    VY = VX !== 0 ? -8.2 : -8.6;
    GROUND = 0;
    FALLY = Y;
    playSfx(sfxJump);
  }
  if (KU === 0) { JUMPL = 0; }

  /* horizontal */
  nx = X + VX;
  if (!bodyHits(nx, Y)) { X = nx; }
  if (X < OX + 4) {
    r = adjRoom(0);
    if (r >= 0) {
      c = ROOM;
      setRoom(r);
      X = X + 552;
      if (bodyHits(X, Y)) { setRoom(c); X = OX + 4; }   /* shut gate on the far side */
    } else { X = OX + 4; }
  }
  if (X > OX + 556) {
    r = adjRoom(1);
    if (r >= 0) {
      c = ROOM;
      setRoom(r);
      X = X - 552;
      if (bodyHits(X, Y)) { setRoom(c); X = OX + 556; } /* shut gate on the far side */
    } else { X = OX + 556; }
  }

  /* vertical */
  if (GROUND === 0) {
    VY = VY + 0.5;
    if (VY > 8) { VY = 8; }
    ny = Y + VY;
    if (VY > 0) {
      sup = supportBelow(X, Y);
      if (ny >= sup) {
        Y = sup;
        GROUND = 1;
        VY = 0;
        if (Y - FALLY > 330) { killKid(); return; }
        if (Y - FALLY > 200) {
          HEARTS = HEARTS - 1;
          HURT = 30;
          playSfx(sfxHit);
          if (HEARTS <= 0) { killKid(); return; }
        } else {
          playSfx(sfxLand);
        }
        stepOn();
      } else {
        Y = ny;
      }
    } else {
      Y = ny;
      if (pointSolid(X, Y - KIDH)) { VY = 0; }
    }
    if (VY < -0.5) { POSE = 5; }
    else if (VY > 0.5) { POSE = 6; }
    grabLedge();
  } else {
    /* still on the ground? (loose floors vanish underfoot) */
    if (supportBelow(X, Y) > Y + 2) {
      GROUND = 0;
      FALLY = Y;
    } else {
      /* walking onto a plate, potion, sword or loose floor triggers it */
      stepOn();
    }
  }

  /* room changes through the floor or the ceiling */
  if (Y > RY + ROOMH + 30) {
    if (adjRoom(3) >= 0) { setRoom(adjRoom(3)); Y = Y - ROOMH; FALLY = Y; }
    else { killKid(); return; }
  }
  if (VY < 0 && Y - KIDH < RY && adjRoom(2) >= 0) {
    setRoom(adjRoom(2));
    Y = Y + ROOMH;
  }

  /* spikes: standing in the trap tile near its base is death */
  r = rowOf(Y);
  c = colOf(X);
  t = tileAt(r, c);
  if ((t === T_SPIKE || t === T_CHOMP) && GROUND === 1) { killKid(); return; }

  /* the open exit door */
  if ((t === T_DOORL_O || t === T_DOORR_O) && KU === 1) {
    KU = 0;
    LV = LV + 1;
    MODE = 3;
    playSfx(sfxWin);
  }

  if (KC === 1 && GROUND === 1 && ATTACK === 0 && SWORD === 1 && VX === 0) { }
  if (ATTACK > 0) { POSE = 16; }
}

/* ------------------------------------------------------------ drawing -- */
function drawRoom() {
  var sx, sy, i, id, r, c, t;
  ctx.fillStyle = "#000000";
  ctx.fillRect(OX, OY, 560, 384);
  if (LV !== 1) {
    /* Levels 2-12 share one tile cell. An open gate is just another cell. */
    for (r = 0; r < 3; r = r + 1) {
      for (c = 0; c < 10; c = c + 1) {
        t = tileAt(r, c);
        if (t === 0) { continue; }
        ctx.drawImage(S_CEL, t * 28, 0, 28, 63,
                      OX + c * TW, OY + (3 + r * 63) * 2, TW, FH);
      }
    }
    return;
  }
  sx = (ROOM % 4) * 280;
  sy = Math.floor(ROOM / 4) * 192;
  ctx.drawImage(S_TILE, sx, sy, 280, 192, OX, OY, 560, 384);
  /* Patches sit on the row under the 24 rooms (y=1152). One 28x63 crop
     per tile the game can change, scanned in the same order as the art. */
  for (i = 0; i < NPATCH; i = i + 1) {
    id = PATCH[i];
    if (Math.floor(id / 30) !== ROOM) { continue; }
    r = Math.floor((id % 30) / 10);
    c = id % 10;
    t = tileAt(r, c);
    if (t === ORIG[ROOM * 3 + r][c]) { continue; }
    ctx.drawImage(S_TILE, i * 28, 1152, 28, 63,
                  OX + c * TW, OY + (3 + r * 63) * 2, TW, FH);
  }
}

function drawKid() {
  var cell = POSE;
  var dx, dy, frac;
  if (FACE > 0) { cell = POSE + 17; }
  /* cell is 64x48 source, drawn at 2x; feet are on source y=45 */
  dx = Math.floor(X) - 64;
  dy = Math.floor(Y) - 90;
  if (HANG === 1) {
    dy = Math.floor(HANY) - 20;
  } else if (CLIMB > 0) {
    frac = (22 - CLIMB) / 22;
    dy = Math.floor(HANY) - 20 - Math.floor(frac * 70);
  }
  if (HURT > 0 && FRAME % 4 < 2) { return; }   /* hurt blink */
  ctx.drawImage(S_KID, cell * 64, 0, 64, 48, dx, dy, 128, 96);
}

function drawGuard() {
  var cell = GPOSE;
  bindGuard();
  if (GCUR < 0) { return; }
  if (GFACE > 0) { cell = GPOSE + 7; }
  ctx.drawImage(S_GRD, cell * 64, 0, 64, 48,
                Math.floor(GX) - 64, Math.floor(GY) - 90, 128, 96);
}

function drawHud() {
  var n, mn, sc;
  ctx.fillStyle = "#1B2130";
  ctx.fillRect(0, 0, 640, 48);
  ctx.fillRect(0, 432, 640, 48);
  /* 8px matches the gaps below. 16px made the words land on each other. */
  ctx.font = "8px mono";
  ctx.fillStyle = "#C9962F";
  ctx.fillText("LEVEL", 12, 22);
  ctx.fillText(LV > 12 ? 12 : LV, 56, 22);
  ctx.fillStyle = "#6C7690";
  ctx.fillText("THE DUNGEON", 100, 22);
  n = 0;
  while (n < 5) {
    ctx.fillStyle = n < HEARTS ? "#D63C42" : "#3A2A34";
    ctx.fillRect(250 + n * 20, 12, 14, 14);
    n = n + 1;
  }
  if (SWORD === 1) {
    ctx.fillStyle = "#C4CCE0";
    ctx.fillText("SWORD", 366, 22);
  }
  mn = Math.floor(TL / 3600);
  sc = Math.floor(TL / 60) - mn * 60;
  ctx.fillStyle = TL < 2700 ? "#D63C42" : "#E6ECFF";
  ctx.fillText("TIME", 470, 22);
  ctx.fillText(mn, 526, 22);
  ctx.fillText(sc < 10 ? ":0" : ":", 542, 22);
  ctx.fillText(sc, 558, 22);
  if (HELPON === 1) {
    ctx.fillStyle = "#FFD680";
    ctx.fillText(LV === 1 ? HINT[ROOM] : "FIND THE SWORD, THEN THE EXIT DOOR.", 8, 462);
  } else if (MSGT > 0) {
    ctx.fillStyle = "#FFD680";
    ctx.fillText(MSG, 320 - MSG.length * 4, 462);
  } else {
    ctx.fillStyle = "#6C7690";
    ctx.fillText("ARROWS MOVE  UP JUMP/CLIMB  Z GRAB  SPACE SWORD  H HELP", 12, 462);
  }
}

function drawTitle() {
  ctx.fillStyle = "#12122A";
  ctx.fillRect(0, 0, 640, 480);
  ctx.font = "24px mono";
  ctx.fillStyle = "#C9962F";
  ctx.fillText("PRINCE OF PERSIA", 128, 120);
  ctx.font = "16px mono";
  ctx.fillStyle = "#E6ECFF";
  ctx.fillText("LEVEL 1 - THE DUNGEON", 152, 176);
  ctx.fillStyle = "#6C7690";
  /* 16px is 16 pixels a letter. These start far enough left to end before 640. */
  ctx.fillText("FIND THE SWORD. BEAT THE GUARD.", 72, 240);
  ctx.fillText("LEAVE BEFORE THE HOUR RUNS OUT.", 72, 272);
  if (Math.floor(FRAME / 24) % 2 === 0) {
    ctx.fillStyle = "#E6ECFF";
    ctx.fillText("PRESS ENTER TO BEGIN", 208, 360);
  }
}

function drawEnd() {
  var mn, sc;
  ctx.fillStyle = "#12122A";
  ctx.fillRect(0, 0, 640, 480);
  ctx.font = "24px mono";
  if (MODE === 3 && LV <= 12) {
    ctx.fillStyle = "#C9962F";
    ctx.fillText("THE NEXT LEVEL AWAITS", 68, 160);
  } else if (MODE === 3) {
    ctx.fillStyle = "#C9962F";
    ctx.fillText("THE DOOR CLOSES BEHIND YOU", 8, 160);
    ctx.font = "16px mono";
    ctx.fillStyle = "#E6ECFF";
    ctx.fillText("ALL TWELVE LEVELS CLEAR", 152, 224);
    mn = Math.floor((216000 - TL) / 3600);
    sc = Math.floor((216000 - TL) / 60) - mn * 60;
    ctx.fillStyle = "#6C7690";
    ctx.fillText("TIME USED", 240, 280);
    ctx.fillStyle = "#E6ECFF";
    ctx.fillText(mn, 352, 280);
    ctx.fillText(sc < 10 ? ":0" : ":", 368, 280);
    ctx.fillText(sc, 384, 280);
  } else {
    ctx.fillStyle = "#D63C42";
    ctx.fillText("THE HOURGLASS IS EMPTY", 56, 160);
  }
  if (Math.floor(FRAME / 24) % 2 === 0) {
    ctx.font = "16px mono";
    ctx.fillStyle = "#E6ECFF";
    ctx.fillText(MODE === 3 && LV <= 12 ? "PRESS ENTER TO CONTINUE" : "PRESS ENTER TO PLAY AGAIN", MODE === 3 && LV <= 12 ? 136 : 176, 360);
  }
}

/* ---------------------------------------------------------------- tick -- */
function playFrame() {
  TL = TL - 1;
  if (TL <= 0) {
    TL = 0;
    MODE = 4;
    return;
  }
  updateKid();
  if (MODE !== 1) { return; }
  resolveAttack();
  updateGuard();
  updateLoose();
  if (MSGT > 0) { MSGT = MSGT - 1; }
  /* The room picture leaves the side margins alone, and its black is
     see-through, so a full clear removes the title text first. */
  ctx.fillStyle = "#000000";
  ctx.fillRect(0, 0, 640, 480);
  drawRoom();
  drawGuard();
  drawKid();
  drawHud();
}

function frame() {
  FRAME = FRAME + 1;
  if (MODE === 0) {
    drawTitle();
  } else if (MODE === 1) {
    playFrame();
  } else if (MODE === 2) {
    ctx.fillStyle = "#000000";
    ctx.fillRect(0, 0, 640, 480);
    DEADT = DEADT - 1;
    drawRoom();
    drawGuard();
    drawKid();
    drawHud();
    if (DEADT <= 0) {
      HEARTS = 3;
      loadLevel();
      MODE = 1;
    }
  } else {
    drawEnd();
  }
  tbSessionFrame(frame);
}

/* --------------------------------------------------------------- input -- */
function tryAttack() {
  if (MODE !== 1 || ATTACK > 0 || HANG === 1 || CLIMB > 0) { return; }
  ATTACK = 14;
  playSfx(sfxSword);
}

tbSessionListen("keydown", function (e) {
  var k = e.keyCode;
  if (k === 37) { KL = 1; }
  else if (k === 39) { KR = 1; }
  else if (k === 38) { KU = 1; }
  else if (k === 40) { KD = 1; }
  else if (k === 90) { KC = 1; }
  else if (k === 32) {
    if (MODE === 3 && LV <= 12) { nextLevel(); }
    else if (MODE === 0 || MODE === 3 || MODE === 4) { startGame(); }
    else { tryAttack(); }
  }
  else if (k === 13) {
    if (MODE === 3 && LV <= 12) { nextLevel(); }
    else if (MODE !== 1 && MODE !== 2) { startGame(); }
  }
  else if (k === 72 && MODE === 1) { HELPON = HELPON === 0 ? 1 : 0; }
});

tbSessionListen("keyup", function (e) {
  var k = e.keyCode;
  if (k === 37) { KL = 0; }
  else if (k === 39) { KR = 0; }
  else if (k === 38) { KU = 0; }
  else if (k === 40) { KD = 0; }
  else if (k === 90) { KC = 0; }
});

function buildPatches() {
  var room, r, c, t;
  LV = 1;
  unpack();
  NPATCH = 0;
  for (room = 0; room < 24; room = room + 1) {
    for (r = 0; r < 3; r = r + 1) {
      for (c = 0; c < 10; c = c + 1) {
        t = WMAP[room * 3 + r][c];
        if (t === 4 || t === 10 || t === 11 || t === 16 || t === 17 || t === 22) {
          PATCH[NPATCH] = room * 30 + r * 10 + c;
          NPATCH = NPATCH + 1;
        }
      }
    }
  }
}

buildPatches();
loadLevel();
MODE = 0;
tbSessionFrame(frame);
tbSessionProgram("PRINCE.HTM");
</script>

/* PRINCE — a Prince of Persia style dungeon crawl for this machine.

   All 12 levels are transcribed from the Apple II original's LEVEL1-LEVEL12
   files (Jordan Mechner's open-source release): each level is 24 rooms of
   10x3 tiles, the room links, the guard placement and the plate -> gate
   wiring (decoded from LINKLOC/LINKMAP, the BUILDER.S encoding: BlueSpec of
   a plate points at its first LINKLOC entry, bit 7 marks the last). The
   exit door advances to the next level. A gate whose Apple II spec is 1
   starts open. A panel with a floor holds you. Spikes spring only if you
   stop on them, and a chopper kills only while it is shut. Level 3 raises
   its skeleton once the exit is open. Level 4 grows a mirror when the
   exit opens, and walking through it breaks it. The one full-strength
   potion is the Apple II boost flask. Running, climbing and the sword
   stay this program's short rules for the guard. The kid's run, jump, turn
   and sword swings are Mechner's sequence table, byte for byte.
   H reads the room you are standing in and says the next step. Level 1's rooms are those pieces
   painted with his Macintosh brick; the spikes, gates, torches, potions,
   doors, sword and bones are the Macintosh frames of those objects. Later
   levels are drawn from one shared set of those same cells. The prince and
   the guard are his Macintosh paintings of those poses
   (artwork/Persia(COLOR)), scaled onto the Apple II feet.
   tools/make_prince_art.py builds the four sheets.

   One room is 280x192 hi-res pixels, drawn at 2x (560x384) with a 40-pixel
   margin. A block is 28x63 source pixels, so 56x126 on screen, and the feet
   stand 20 pixels above the bottom of the block (VertDist 10, times 2).
   Walking off an edge follows the room link on that side. Run, jump, grab
   ledges (hold Z or Up),
   climb, find the sword, beat the guard, open the exit door. 60 minutes.

   Keys: Left/Right run   Up jump / climb up   Down crouch / climb down
   Z careful step / grab   Space sword   H help for this room
   Enter start   Esc is BREAK. */

      else if (LSR[i] === 1) { M1[LSC[i]] = T_AIR; }
      else { M2[LSC[i]] = T_AIR; }
      playSfx(sfxLoose);
    } else {
      LSR[n] = LSR[i];
      LSC[n] = LSC[i];
      LST[n] = LST[i];
      n = n + 1;
    }
  }
  LSN = n;
}

/* ------------------------------------------------------------- death -- */
function killKid() {
  if (MODE !== 1) { return; }
  MODE = 2;
  DEADT = 90;
  POSE = 14;
  HANG = 0;
  CLIMB = 0;
  playSfx(sfxDie);
}

/* -------------------------------------------------------------- guard -- */
function updateGuard() {
  var d, ad, nx;
  bindGuard();
  if (GCUR < 0 || GDEAD === 1) { return; }
  if (GY - Y > 40 || Y - GY > 40) { GPOSE = 0; return; }
  d = X - GX;
  ad = d < 0 ? -d : d;
  if (GSTATE === 1) {           /* windup */
    GPOSE = 4;
    GT = GT - 1;
    if (GT <= 0) { GSTATE = 2; GT = 10; }
    return;
  }
  if (GSTATE === 2) {           /* strike lands early in the swing */
    GPOSE = 3;
    GT = GT - 1;
    if (GT === 6 && ad < 64) {
      if (ATTACK > 2) { playSfx(sfxClang); }
      else {
        HEARTS = HEARTS - 1;
        HURT = 30;
        X = X + (d < 0 ? -20 : 20);
        playSfx(sfxHit);
        if (HEARTS <= 0) { killKid(); return; }
      }
    }
    if (GT <= 0) { GSTATE = 0; GAT = FRAME + 40; }
    return;
  }
  GFACE = d < 0 ? -1 : 1;
  if (ad > 52) {
    nx = GX + (d < 0 ? -1.1 : 1.1);
    if (!bodyHitsAt(nx, GY)) { GX = nx; }
    GPOSE = 1 + (Math.floor(FRAME / 10) % 2);
  } else {
    GPOSE = 0;
    if (FRAME >= GAT) { GSTATE = 1; GT = 14; }
  }
}
function bodyHitsAt(nx, y) {
  return bodyHits(nx, y);
}
/* The kid's sword lands. */
function resolveAttack() {
  var d;
  if (ATTACK !== 8 || SWORD !== 1) { return; }
  bindGuard();
  if (GCUR < 0 || GDEAD === 1) { return; }
  d = GX - X;
  if (d < 0) { d = -d; }
  if (d > 62 || GY - Y > 40 || Y - GY > 40) { return; }
  GHP = GHP - 1;
  playSfx(sfxClang);
  if (GHP <= 0) {
    GDEAD = 1;
    GPOSE = 6;
    say("THE GUARD FALLS");
  } else {
    GX = GX + (GFACE * 22);
    GPOSE = 5;
    GSTATE = 0;
    GAT = FRAME + 50;
  }
  saveGuard();
}

/* ---------------------------------------------------------------- kid -- */
/* One byte of Jordan Mechner's sequence table. Two source chars, one byte. */
function sb(i) {
  return (strByte(SEQ, i * 2) - 48) * 16 + (strByte(SEQ, i * 2 + 1) - 48);
}
/* Sequence numbers are his: 1 startrun, 2 stand, 3 standjump, 4 runjump. */
function jumpSeq(n) {
  var a;
  a = (n - 1) * 2;
  SIP = sb(a) + sb(a + 1) * 256;
}
/* COLL.S animchar. Opcodes run until a frame number, and that frame shows. */
function animChar() {
  var b, n, d;
  n = 0;
  while (n < 40) {
    b = sb(SIP);
    SIP = SIP + 1;
    if (b === 251) {
      d = sb(SIP); SIP = SIP + 1;
      if (d >= 128) { d = d - 256; }
      if (CFACE < 0) { d = -d; }
      CX = CX + d;
    } else if (b === 250) {
      d = sb(SIP); SIP = SIP + 1;
      if (d >= 128) { d = d - 256; }
      CY = CY + d;
    } else if (b === 254) {
      CFACE = CFACE < 0 ? 0 : -1;
    } else if (b === 255) {
      SIP = sb(SIP) + sb(SIP + 1) * 256;
    } else if (b === 249) {
      CACT = sb(SIP); SIP = SIP + 1;
    } else if (b === 248) {
      XV = sb(SIP); if (XV >= 128) { XV = XV - 256; } SIP = SIP + 1;
      YV = sb(SIP); if (YV >= 128) { YV = YV - 256; } SIP = SIP + 1;
    } else if (b === 247) {
      if (WTLESS === 1) { SIP = sb(SIP) + sb(SIP + 1) * 256; }
      else { SIP = SIP + 2; }
    } else if (b === 242 || b === 243) {
      SIP = SIP + 1;
    } else if (b >= 241) {
      /* up, down, die, jar: the level tiles cover those */
    } else {
      CPOS = b;
      return;
    }
    n = n + 1;
  }
}
function syncKid() {
  FACE = CFACE < 0 ? -1 : 1;
  X = OX + (CX - 58) * 4;
  Y = OY + CY * 2;
  GROUND = (CACT === 0 || CACT === 1) ? 1 : 0;
  if (CPOS >= 0 && CPOS < 256) { POSE = strByte(FDR, CPOS) - 48; }
}
/* Standing, running, jumping and the sword, from his CTRL.S.
   Forward means the direction he is facing. */
function seqKid() {
  var fwd, back, old, r, sup;
  if (CACT === 4) {
    YV = YV + 3;
    if (YV > 33) { YV = 33; }
    CX = CX + XV;
    CY = CY + YV;
  }
  if (KU === 0) { JUMPL = 0; }
  fwd = 0;
  back = 0;
  if (CFACE < 0) { if (KL === 1) { fwd = 1; } if (KR === 1) { back = 1; } }
  else { if (KR === 1) { fwd = 1; } if (KL === 1) { back = 1; } }
  bindGuard();
  if (ENG === 2 && (GCUR < 0 || GDEAD === 1) && CPOS === 171) {
    ENG = 0; jumpSeq(92);
  } else if (ENG === 2 && (CPOS === 158 || CPOS === 170 || CPOS === 171)) {
    if (KBTN === 1) { jumpSeq(75); KBTN = 0; }
    else if (back === 1) { jumpSeq(57); }
    else if (fwd === 1) { jumpSeq(86); }
  } else if (CPOS === 15 || (CPOS >= 50 && CPOS <= 52)) {
    if (KBTN === 1 && SWORD === 1) { ENG = 2; KBTN = 0; jumpSeq(55); }
    else if (KU === 1 && JUMPL === 0 && fwd === 1) { JUMPL = 1; jumpSeq(3); }
    else if (KU === 1 && JUMPL === 0) { JUMPL = 1; jumpSeq(14); }
    else if (fwd === 1 && KC === 1) { jumpSeq(42); }
    else if (fwd === 1) { jumpSeq(1); }
    else if (back === 1) { jumpSeq(5); }
    else if (KD === 1) { jumpSeq(50); }
  } else if (CPOS >= 1 && CPOS <= 3) {
    if (KU === 1 && fwd === 1 && JUMPL === 0) { JUMPL = 1; jumpSeq(3); }
  } else if (CPOS >= 4 && CPOS < 15) {
    if (back === 1) { jumpSeq(6); }
    else if (KU === 1 && JUMPL === 0) { JUMPL = 1; jumpSeq(4); }
    else if (KD === 1) { jumpSeq(26); }
    else if (fwd === 0 && (CPOS === 7 || CPOS === 11)) { jumpSeq(13); }
  } else if (CPOS === 109) {
    if (KD === 0) { jumpSeq(49); }
  } else if (CPOS >= 87 && CPOS <= 99) {
    if (KU === 1) { jumpSeq(10); }
    else if (KD === 1) { jumpSeq(11); }
  }
  if ((CPOS === 154 || CPOS === 155) && HITF !== CPOS) {
    ATTACK = 8; HITF = CPOS; playSfx(sfxSword);
  }
  old = CX;
  animChar();
  syncKid();
  if (bodyHits(X, Y)) { CX = old; syncKid(); }
  if (CX < 58) {
    r = adjRoom(0);
    if (r >= 0) { setRoom(r); CX = CX + 140; }
    else { CX = 58; }
  }
  if (CX > 198) {
    r = adjRoom(1);
    if (r >= 0) { setRoom(r); CX = CX - 140; }
    else { CX = 198; }
  }
  if (CY > 210) {
    r = adjRoom(3);
    if (r >= 0) { setRoom(r); CY = CY - 192; }
    else { killKid(); return; }
  }
  if (CY < 8 && YV < 0) {
    r = adjRoom(2);
    if (r >= 0) { setRoom(r); CY = CY + 192; }
  }
  syncKid();
  if (CACT === 4) {
    /* Feet can cross a whole step in one frame, so test the floor they left. */
    sup = supportBelow(X, Y - YV * 2);
    if (YV > 0 && Y - YV * 2 <= sup && Y >= sup) {
      CY = (sup - OY) / 2;
      if (YV >= 33) { killKid(); return; }
      if (YV >= 22) {
        HEARTS = HEARTS - 1; HURT = 30;
        if (HEARTS <= 0) { killKid(); return; }
        jumpSeq(20);
      } else { jumpSeq(17); }
      YV = 0; XV = 0;
      animChar();
      syncKid();
    } else {
      VY = YV;
      grabLedge();
    }
  } else if (GROUND === 1 && supportBelow(X, Y) > Y + 20) {
    jumpSeq(7);
    animChar();
    syncKid();
  }
  if (GROUND === 1) { stepOn(); }
  KBTN = 0;
}

function grabLedge() {
  var gx, c, b;
  if (VY <= 0) { return; }
  if (KC !== 1 && KU !== 1) { return; }
  gx = X + FACE * 14;
  c = colOf(gx);
  b = supportBelow(c * TW + 32, Y - 84);
  if (b - (Y - 88) >= -2 && b - (Y - 88) <= 18) {
    if (bodyHits(c * TW + 32, b)) { return; }
    CX = 58 + ((c * TW + 32) - OX) / 4;
    CY = (b - OY) / 2;
    YV = 0;
    XV = 0;
    jumpSeq(9);
    animChar();
    syncKid();
    playSfx(sfxGrab);
  }
}

function startClimbDown() {
  var ahead = supportBelow(X + FACE * 20, Y);
  if (ahead <= Y + 4) { return 0; }         /* no drop ahead: just crouch */
  FACE = -FACE;
  HANY = Y;
  HANG = 1;
  GROUND = 0;
  X = X - FACE * 6;
  POSE = 7;
  return 1;
}

function updateKid() {
  var j, r, c, t;
  if (HURT > 0) { HURT = HURT - 1; }
  if (ATTACK > 0) { ATTACK = ATTACK - 1; }
  j = joy();
  if ((j & 4) !== 0) { KL = 1; }
  if ((j & 8) !== 0) { KR = 1; }
  if ((j & 1) !== 0) { KU = 1; }
  if ((j & 2) !== 0) { KD = 1; }
  seqKid();
  if (MODE !== 1) { return; }
  r = rowOf(Y);
  c = colOf(X);
  t = tileAt(r, c);
  if (t === T_SPIKE && GROUND === 1) {
    if (SPOT !== r * 10 + c) { SPOT = r * 10 + c; SPDW = 22; }
    else {
      SPDW = SPDW - 1;
      if (SPDW <= 0) { killKid(); return; }
    }
  } else { SPOT = -1; }
  if (t === T_CHOMP && GROUND === 1 && FRAME % 60 < 24) { killKid(); return; }
  if ((t === T_DOORL_O || t === T_DOORR_O) && KU === 1) {
    KU = 0;
    LV = LV + 1;
    MODE = 3;
    playSfx(sfxWin);
  }
}

/* ------------------------------------------------------------ drawing -- */
function drawRoom() {
  var sx, sy, i, id, r, c, t;
  ctx.fillStyle = "#000000";
  ctx.fillRect(OX, OY, 560, 384);
  if (LV !== 1) {
    /* Levels 2-12 share one tile cell. An open gate is just another cell. */
    for (r = 0; r < 3; r = r + 1) {
      for (c = 0; c < 10; c = c + 1) {
        t = tileAt(r, c);
        if (t === 0) { continue; }
        if (t === T_MIRROR) { t = 4; }   /* the gate cell is the visible mirror */
        ctx.drawImage(S_CEL, t * 28, 0, 28, 63,
                      OX + c * TW, OY + (3 + r * 63) * 2, TW, FH);
      }
    }
    return;
  }
  sx = (ROOM % 4) * 280;
  sy = Math.floor(ROOM / 4) * 192;
  ctx.drawImage(S_TILE, sx, sy, 280, 192, OX, OY, 560, 384);
  /* Patches sit on the row under the 24 rooms (y=1152). One 28x63 crop
     per tile the game can change, scanned in the same order as the art. */
  for (i = 0; i < NPATCH; i = i + 1) {
    id = PATCH[i];
    if (Math.floor(id / 30) !== ROOM) { continue; }
    r = Math.floor((id % 30) / 10);
    c = id % 10;
    t = tileAt(r, c);
    if (t === ORIG[ROOM * 3 + r][c]) { continue; }
    ctx.drawImage(S_TILE, i * 28, 1152, 28, 63,
                  OX + c * TW, OY + (3 + r * 63) * 2, TW, FH);
  }
}

function drawKid() {
  var cell = POSE;
  var dx, dy, frac;
  if (FACE > 0) { cell = POSE + 17; }
  /* cell is 64x48 source, drawn at 2x; feet are on source y=45 */
  dx = Math.floor(X) - 64;
  dy = Math.floor(Y) - 90;
  if (HANG === 1) {
    dy = Math.floor(HANY) - 20;
  } else if (CLIMB > 0) {
    frac = (22 - CLIMB) / 22;
    dy = Math.floor(HANY) - 20 - Math.floor(frac * 70);
  }
  if (HURT > 0 && FRAME % 4 < 2) { return; }   /* hurt blink */
  ctx.drawImage(S_KID, cell * 64, 0, 64, 48, dx, dy, 128, 96);
}

function drawGuard() {
  var cell = GPOSE;
  bindGuard();
  if (GCUR < 0) { return; }
  if (GFACE > 0) { cell = GPOSE + 7; }
  ctx.drawImage(S_GRD, cell * 64, 0, 64, 48,
                Math.floor(GX) - 64, Math.floor(GY) - 90, 128, 96);
}

/* H reads this room. One fixed line, under 64 letters, so fillText draws it all. */
function roomHas(id) {
  var r, c;
  r = 0;
  while (r < 3) {
    c = 0;
    while (c < 10) {
      if (tileAt(r, c) === id) { return 1; }
      c = c + 1;
    }
    r = r + 1;
  }
  return 0;
}
function edgeOpen(side) {
  var col, r, t;
  if (adjRoom(side) < 0) { return 0; }
  col = side === 0 ? 0 : 9;
  r = 0;
  while (r < 3) {
    t = tileAt(r, col);
    if (!solidT(t)) { return r + 1; }
    r = r + 1;
  }
  return 0;
}
function canDrop() {
  var c, t;
  if (adjRoom(3) < 0) { return 0; }
  c = 0;
  while (c < 10) {
    t = tileAt(2, c);
    if (t === T_AIR || t === T_LOOSE) { return 1; }
    c = c + 1;
  }
  return 0;
}
function canClimb() {
  var c;
  if (adjRoom(2) < 0) { return 0; }
  c = 0;
  while (c < 10) {
    if (tileAt(0, c) === T_AIR) { return 1; }
    c = c + 1;
  }
  return 0;
}
function drawHint() {
  var L, R;
  ctx.fillStyle = "#FFD680";
  bindGuard();
  if (roomHas(T_DOORL_O) || roomHas(T_DOORR_O)) {
    ctx.fillText("PRESS UP INSIDE THE OPEN DOOR.", 8, 462);
    return;
  }
  if (SWORD === 0 && roomHas(T_SWORD)) {
    ctx.fillText("THE SWORD IS HERE. WALK ONTO IT.", 8, 462);
    return;
  }
  if (GCUR >= 0 && GDEAD === 0) {
    if (SWORD === 0) { ctx.fillText("A GUARD IS HERE. COME BACK WITH THE SWORD.", 8, 462); }
    else { ctx.fillText("A GUARD IS HERE. FACE HIM AND PRESS SPACE.", 8, 462); }
    return;
  }
  if (roomHas(T_DOORL) || roomHas(T_DOORR)) {
    if (roomHas(T_PLATEUP) || roomHas(T_PLATEDN) || roomHas(T_PLATEX)) {
      ctx.fillText("STEP ON THE PLATE, THEN PRESS UP IN THE DOOR.", 8, 462);
    } else {
      ctx.fillText("THE DOOR IS SHUT. FIND THE PLATE THAT OPENS IT.", 8, 462);
    }
    return;
  }
  if (roomHas(T_MIRROR)) {
    ctx.fillText("WALK THROUGH THE MIRROR.", 8, 462);
    return;
  }
  if (roomHas(T_LOOSE)) {
    ctx.fillText("STAND ON THE LOOSE FLOOR AND WAIT. IT FALLS.", 8, 462);
    return;
  }
  if (roomHas(T_GATE)) {
    ctx.fillText("A GATE IS SHUT. FIND THE PLATE THAT OPENS IT.", 8, 462);
    return;
  }
  if (roomHas(T_CHOMP)) {
    ctx.fillText("THE CHOPPER KILLS YOU. CROSS WHILE IT IS UP.", 8, 462);
    return;
  }
  if (roomHas(T_SPIKE)) {
    ctx.fillText("CROSS THE SPIKES WITHOUT STOPPING.", 8, 462);
    return;
  }
  L = edgeOpen(0);
  R = edgeOpen(1);
  if (L > 0 && R > 0) { ctx.fillText("LEFT AND RIGHT BOTH LEAVE.", 8, 462); return; }
  if (R > 0 && canDrop()) { ctx.fillText("GO RIGHT, OR DROP DOWN.", 8, 462); return; }
  if (L > 0 && canDrop()) { ctx.fillText("GO LEFT, OR DROP DOWN.", 8, 462); return; }
  if (R === 1) { ctx.fillText("GO RIGHT ON THE TOP FLOOR.", 8, 462); return; }
  if (R === 2) { ctx.fillText("GO RIGHT ON THE MIDDLE FLOOR.", 8, 462); return; }
  if (R === 3) { ctx.fillText("GO RIGHT ON THE BOTTOM FLOOR.", 8, 462); return; }
  if (L === 1) { ctx.fillText("GO LEFT ON THE TOP FLOOR.", 8, 462); return; }
  if (L === 2) { ctx.fillText("GO LEFT ON THE MIDDLE FLOOR.", 8, 462); return; }
  if (L === 3) { ctx.fillText("GO LEFT ON THE BOTTOM FLOOR.", 8, 462); return; }
  if (canDrop()) { ctx.fillText("DROP THROUGH A HOLE IN THE FLOOR.", 8, 462); return; }
  if (canClimb()) { ctx.fillText("CLIMB UP THROUGH THE CEILING.", 8, 462); return; }
  if (roomHas(T_POTION) && HEARTS < 5) { ctx.fillText("A POTION IS HERE. WALK ONTO IT.", 8, 462); return; }
  ctx.fillText("NO OPEN EDGE. GO BACK THE WAY YOU CAME.", 8, 462);
}

function drawHud() {
  var n, mn, sc;
  ctx.fillStyle = "#1B2130";
  ctx.fillRect(0, 0, 640, 48);
  ctx.fillRect(0, 432, 640, 48);
  /* 8px matches the gaps below. 16px made the words land on each other. */
  ctx.font = "8px mono";
  ctx.fillStyle = "#C9962F";
  ctx.fillText("LEVEL", 12, 22);
  ctx.fillText(LV > 12 ? 12 : LV, 56, 22);
  ctx.fillStyle = "#6C7690";
  ctx.fillText("THE DUNGEON", 100, 22);
  n = 0;
  while (n < 5) {
    ctx.fillStyle = n < HEARTS ? "#D63C42" : "#3A2A34";
    ctx.fillRect(250 + n * 20, 12, 14, 14);
    n = n + 1;
  }
  if (SWORD === 1) {
    ctx.fillStyle = "#C4CCE0";
    ctx.fillText("SWORD", 366, 22);
  }
  mn = Math.floor(TL / 3600);
  sc = Math.floor(TL / 60) - mn * 60;
  ctx.fillStyle = TL < 2700 ? "#D63C42" : "#E6ECFF";
  ctx.fillText("TIME", 470, 22);
  ctx.fillText(mn, 526, 22);
  ctx.fillText(sc < 10 ? ":0" : ":", 542, 22);
  ctx.fillText(sc, 558, 22);
  if (HELPON === 1) {
    drawHint();
  } else if (MSGT > 0) {
    ctx.fillStyle = "#FFD680";
    ctx.fillText(MSG, 320 - MSG.length * 4, 462);
  } else {
    ctx.fillStyle = "#6C7690";
    ctx.fillText("ARROWS MOVE  UP JUMP/CLIMB  Z GRAB  SPACE SWORD  H HELP", 12, 462);
  }
}

function drawTitle() {
  ctx.fillStyle = "#12122A";
  ctx.fillRect(0, 0, 640, 480);
  ctx.font = "24px mono";
  ctx.fillStyle = "#C9962F";
  ctx.fillText("PRINCE OF PERSIA", 128, 120);
  ctx.font = "16px mono";
  ctx.fillStyle = "#E6ECFF";
  ctx.fillText("LEVEL 1 - THE DUNGEON", 152, 176);
  ctx.fillStyle = "#6C7690";
  /* 16px is 16 pixels a letter. These start far enough left to end before 640. */
  ctx.fillText("FIND THE SWORD. BEAT THE GUARD.", 72, 240);
  ctx.fillText("LEAVE BEFORE THE HOUR RUNS OUT.", 72, 272);
  if (Math.floor(FRAME / 24) % 2 === 0) {
    ctx.fillStyle = "#E6ECFF";
    ctx.fillText("PRESS ENTER TO BEGIN", 208, 360);
  }
}

function drawEnd() {
  var mn, sc;
  ctx.fillStyle = "#12122A";
  ctx.fillRect(0, 0, 640, 480);
  ctx.font = "24px mono";
  if (MODE === 3 && LV <= 12) {
    ctx.fillStyle = "#C9962F";
    ctx.fillText("THE NEXT LEVEL AWAITS", 68, 160);
  } else if (MODE === 3) {
    ctx.fillStyle = "#C9962F";
    ctx.fillText("THE DOOR CLOSES BEHIND YOU", 8, 160);
    ctx.font = "16px mono";
    ctx.fillStyle = "#E6ECFF";
    ctx.fillText("ALL TWELVE LEVELS CLEAR", 152, 224);
    mn = Math.floor((216000 - TL) / 3600);
    sc = Math.floor((216000 - TL) / 60) - mn * 60;
    ctx.fillStyle = "#6C7690";
    ctx.fillText("TIME USED", 240, 280);
    ctx.fillStyle = "#E6ECFF";
    ctx.fillText(mn, 352, 280);
    ctx.fillText(sc < 10 ? ":0" : ":", 368, 280);
    ctx.fillText(sc, 384, 280);
  } else {
    ctx.fillStyle = "#D63C42";
    ctx.fillText("THE HOURGLASS IS EMPTY", 56, 160);
  }
  if (Math.floor(FRAME / 24) % 2 === 0) {
    ctx.font = "16px mono";
    ctx.fillStyle = "#E6ECFF";
    ctx.fillText(MODE === 3 && LV <= 12 ? "PRESS ENTER TO CONTINUE" : "PRESS ENTER TO PLAY AGAIN", MODE === 3 && LV <= 12 ? 136 : 176, 360);
  }
}

/* ---------------------------------------------------------------- tick -- */
function playFrame() {
  TL = TL - 1;
  if (TL <= 0) {
    TL = 0;
    MODE = 4;
    return;
  }
  updateKid();
  if (MODE !== 1) { return; }
  wakeBones();
  resolveAttack();
  updateGuard();
  updateLoose();
  if (MSGT > 0) { MSGT = MSGT - 1; }
  /* The room picture leaves the side margins alone, and its black is
     see-through, so a full clear removes the title text first. */
  ctx.fillStyle = "#000000";
  ctx.fillRect(0, 0, 640, 480);
  drawRoom();
  drawGuard();
  drawKid();
  drawHud();
}

function frame() {
  FRAME = FRAME + 1;
  if (MODE === 0) {
    drawTitle();
  } else if (MODE === 1) {
    playFrame();
  } else if (MODE === 2) {
    ctx.fillStyle = "#000000";
    ctx.fillRect(0, 0, 640, 480);
    DEADT = DEADT - 1;
    drawRoom();
    drawGuard();
    drawKid();
    drawHud();
    if (DEADT <= 0) {
      HEARTS = 3;
      loadLevel();
      MODE = 1;
    }
  } else {
    drawEnd();
  }
  tbSessionFrame(frame);
}

/* --------------------------------------------------------------- input -- */
function tryAttack() {
  if (MODE !== 1 || ATTACK > 0 || HANG === 1 || CLIMB > 0) { return; }
  ATTACK = 14;
  playSfx(sfxSword);
}

tbSessionListen("keydown", function (e) {
  var k = e.keyCode;
  if (k === 37) { KL = 1; }
  else if (k === 39) { KR = 1; }
  else if (k === 38) { KU = 1; }
  else if (k === 40) { KD = 1; }
  else if (k === 90) { KC = 1; }
  else if (k === 32) {
    if (MODE === 3 && LV <= 12) { nextLevel(); }
    else if (MODE === 0 || MODE === 3 || MODE === 4) { startGame(); }
    else { KBTN = 1; }
  }
  else if (k === 13) {
    if (MODE === 3 && LV <= 12) { nextLevel(); }
    else if (MODE !== 1 && MODE !== 2) { startGame(); }
  }
  else if (k === 72 && MODE === 1) { HELPON = HELPON === 0 ? 1 : 0; }
});

tbSessionListen("keyup", function (e) {
  var k = e.keyCode;
  if (k === 37) { KL = 0; }
  else if (k === 39) { KR = 0; }
  else if (k === 38) { KU = 0; }
  else if (k === 40) { KD = 0; }
  else if (k === 90) { KC = 0; }
});

function buildPatches() {
  var room, r, c, t;
  LV = 1;
  unpack();
  NPATCH = 0;
  for (room = 0; room < 24; room = room + 1) {
    for (r = 0; r < 3; r = r + 1) {
      for (c = 0; c < 10; c = c + 1) {
        t = WMAP[room * 3 + r][c];
        if (t === 4 || t === 10 || t === 11 || t === 16 || t === 17 || t === 22) {
          PATCH[NPATCH] = room * 30 + r * 10 + c;
          NPATCH = NPATCH + 1;
        }
      }
    }
  }
}

buildPatches();
loadLevel();
MODE = 0;
tbSessionFrame(frame);
tbSessionProgram("PRINCE.HTM");
</script>

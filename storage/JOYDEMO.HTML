<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Joystick demo — JMR</title></head>
<body style="margin:0;background:#000">
<!-- LOAD "JOYDEMO.HTML" then RUN. Stick / arrows / WASD move; Space fire. -->
<canvas id="gameCanvas" width="640" height="480"></canvas>
<script>
var canvas = document.querySelector("canvas");
var c = canvas.getContext("2d");
c.imageSmoothingEnabled = false;

var W = 640;
var H = 480;
var x = 300;
var y = 220;
var fire = 0;
var leftHeld = 0;
var rightHeld = 0;
var upHeld = 0;
var downHeld = 0;
var fireHeld = 0;

console.log("JOY DEMO");

// Stick on the chip is KEYEVT + joy_in, not e.key. PACMAN reads keyCode;
// missing "ArrowLeft" intern still plays. 37/39/38/40/32/13 = arrows/Space/Enter.
addEventListener("keydown", function (e) {
  var k = e.key;
  var c = e.keyCode;
  if (k === "ArrowLeft" || k === "a" || k === "A" || c === 37 || c === 65) leftHeld = 1;
  if (k === "ArrowRight" || k === "d" || k === "D" || c === 39 || c === 68) rightHeld = 1;
  if (k === "ArrowUp" || k === "w" || k === "W" || c === 38 || c === 87) upHeld = 1;
  if (k === "ArrowDown" || k === "s" || k === "S" || c === 40 || c === 83) downHeld = 1;
  if (k === " " || k === "Enter" || c === 32 || c === 13) fireHeld = 1;
});
addEventListener("keyup", function (e) {
  var k = e.key;
  var c = e.keyCode;
  if (k === "ArrowLeft" || k === "a" || k === "A" || c === 37 || c === 65) leftHeld = 0;
  if (k === "ArrowRight" || k === "d" || k === "D" || c === 39 || c === 68) rightHeld = 0;
  if (k === "ArrowUp" || k === "w" || k === "W" || c === 38 || c === 87) upHeld = 0;
  if (k === "ArrowDown" || k === "s" || k === "S" || c === 40 || c === 83) downHeld = 0;
  if (k === " " || k === "Enter" || c === 32 || c === 13) fireHeld = 0;
});

// joy() is a host helper; the card .JSH compiles it to CALL_NATIVE stub 33
// (not in NATIVE_IDS) so it is always 0 on FPGA-SIM/BOARD. keyLeft/Right/
// Up/Down/Fire are natives 4/5/8/9/6 and read joy_in (Pmod JB + GUI KEYBITS).
function bits() {
  var j = 0;
  try { j = joy() | 0; } catch (e) { j = 0; }
  try { if (keyUp()) j = j | 1; } catch (e) {}
  try { if (keyDown()) j = j | 2; } catch (e) {}
  try { if (keyLeft()) j = j | 4; } catch (e) {}
  try { if (keyRight()) j = j | 8; } catch (e) {}
  try { if (keyFire()) j = j | 16; } catch (e) {}
  return j;
}

function loop() {
  var j = bits();
  var l = leftHeld || (j & 4);
  var r = rightHeld || (j & 8);
  var u = upHeld || (j & 1);
  var d = downHeld || (j & 2);
  fire = fireHeld || (j & 16);
  if (l) x = x - 4;
  if (r) x = x + 4;
  if (u) y = y - 4;
  if (d) y = y + 4;
  if (x < 8) x = 8;
  if (x > W - 48) x = W - 48;
  if (y < 40) y = 40;
  if (y > H - 48) y = H - 48;

  c.fillStyle = "#000000";
  c.fillRect(0, 0, W, H);
  c.fillStyle = fire ? "#FFFF00" : "#3DFF9A";
  c.fillRect(x, y, 40, 40);
  c.fillStyle = "#FFFFFF";
  c.fillText("JOY DEMO", 8, 16);
  c.fillText("ARROWS / WASD / STICK   SPACE FIRE", 8, 32);
  c.fillText("U" + u + " D" + d + " L" + l + " R" + r + " F" + fire + " JOY " + j, 8, 464);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>

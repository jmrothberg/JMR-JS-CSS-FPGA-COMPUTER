// The system draws the menu bar and the window frame. This window
// does not scroll: windowBars is 0, so there is no scroll bar.
// The hand moves the page. This file draws only in the white hole:
// tools at the left, the page, line widths, colors, and patterns.
//
// No new CPU instruction. The page, one undo, and the clipboard are
// bytes in the compile arena (stgRead / stgWrite), which the chip
// already has. ImageData is a blit snapshot and a program cannot
// index its pixels, so the bits live here instead:
//   3072..4095   flood stack, or the lasso point list (not both at once)
//   4096         page, 576 x 320, 72 bytes a row, 23040 bytes
//   27136        undo, the same size. Undo swaps the two buffers.
//   50176        clipboard, 23552 bytes. A full-page copy fits.
//   73728        color of each page pixel, 4 bits, 92160 bytes.
//   165888       undo of those colors. 258048 is the visit bits, 23040 bytes.
//   281088       swap scratch, 92160 bytes. Undo exchanges two buffers
//                through it. It does not overlap the page, undo, or clipboard.
//                A drag also CopyBits one glass rectangle into this scratch
//                (the offscreen port). Undo clears that grab first.
//   373248       four 64-byte descriptors: 1-bit page, 4-bit color, screen, port.
// The page is shown with toolbox 3 (packed blit, FatBits scale 8). A drag
// copies one glass rectangle into the swap port with toolbox 6 and puts it
// back on the next move. Color stays; the 1984 page was black ink on white,
// and the grid snaps without painting dots.
//   1900         file name. 1920 is the 8-byte header.
// The color bytes sit in the image half of the arena. The 1-bit page,
// its undo, and the clipboard already fill the first 73728 bytes.
// A color byte there would not fit. This program does not load a
// picture into that image half, so the colors use it.
//   3600         up to 14 picture names copied out of the fsList.
// The page is 576 by 320 because the page, the undo copy, and a
// full-page clipboard have to fit in the 73728-byte arena. A taller
// classic page does not fit beside those copies. That is a size
// limit, not a missing instruction.
// fsList writes the directory at byte 256 and can run on for as many
// files as the disk has. Open copies the page into the undo buffer
// first, reads names until byte 3500, stores them at 3600, then
// copies the page back. Open clears Undo. The arena is scratch: it
// is not kept when the program quits, so Disk Save writes the page.
//
// The menu bar is the 1984 MacPaint bar: File, Edit, Goodies, Font,
// FontSize, Style. The program owns those menus (the descriptor
// starts with File|). Quit and Close leave. Open... and Save As...
// are the shared boxes. The chosen name is left at arena bytes 96-111.
// Save writes STEM.PNT with fsWrite: bytes P N T 2, then width and
// height as little-endian u16, then the packed bits (1 = ink, high
// bit is the left pixel), then the color nibbles. An older P N T 1
// file loads as black ink. New discards the page. Quit does not ask.
// The title stripes say untitled, which is the name in the 1984
// string table.

// file. Size, bold, italic, underline, and alignment change that face.
// The other font names are the ones on the 1984 System disk. There
// is no second typeface to draw, so those choices only move the check.

function portBits(gx,gy,w,h,back){

 tbFill(d,0,64); tbFill(s,0,64);
 stgWrite(d,1); stgWrite(d+1,8); stgWrite(d+2,2); stgWrite(d+3,1);

function takeGrab(){

function pollJoy(){
 var nx,ny,f;

 // joy() is not a chip instruction. The stick is keyUp/Down/Left/Right/Fire.
 nx=penX; ny=penY; f=0;

function frame(){

  if(down==0&&mode==0&&(tbBits&4)!=0){

   else if(tool==3&&(tick%24)==0){ showView(); drawCaret(); if(penShow) refreshPen(); }

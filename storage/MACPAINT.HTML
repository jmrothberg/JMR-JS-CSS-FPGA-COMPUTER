function drawDoc(){
 var y,x,b,i,z,dw,dh,run,base,c;
 z=1; if(fat) z=8; dw=viewW(); dh=viewH();
 ctx.fillStyle="#FFFFFF"; ctx.fillRect(VX,VY,VW,VH);
 y=0;
 while(y<dh){
  x=0; base=4096+(docY+y)*72;
  while(x<dw){
   i=(docX+x)-Math.floor((docX+x)/8)*8;
   b=stgRead(base+Math.floor((docX+x)/8));
   if(b==0) x=x+(8-i);
   else while(i<8&&x<dw){
    if((Math.floor(b/MASK[i])%2)){
     c=shown(docX+x,docY+y); run=1; i=i+1; x=x+1;
     while(i<8&&x<dw&&(Math.floor(b/MASK[i])%2)&&shown(docX+x,docY+y)==c){ run=run+1; i=i+1; x=x+1; }
     useColor(c); ctx.fillRect(VX+(x-run)*z,VY+y*z,run*z,z);

   }
  }

 }

}

 i=0; while(i<7){ paintDot(tx,ty+i,1); i=i+1; }

function restorePen(){
 paintDot(oldPX,oldPY,shown(oldPX,oldPY)); paintDot(oldPX-1,oldPY,shown(oldPX-1,oldPY));
 paintDot(oldPX+1,oldPY,shown(oldPX+1,oldPY)); paintDot(oldPX,oldPY-1,shown(oldPX,oldPY-1));

 paintDot(penX,penY,1-pix(penX,penY)); paintDot(penX-1,penY,1-pix(penX-1,penY));
 paintDot(penX+1,penY,1-pix(penX+1,penY)); paintDot(penX,penY-1,1-pix(penX,penY-1));

 if(penShow&&mode==0) refreshPen();

function pollJoy(){
 var nx,ny,f;
 if(mode!=0||job) return;
 // joy() is not a chip instruction. The stick is keyUp/Down/Left/Right/Fire.
 nx=penX; ny=penY; f=0;
 if(keyUp()) ny=ny-1; if(keyDown()) ny=ny+1;
 if(keyLeft()) nx=nx-1; if(keyRight()) nx=nx+1;
 if(keyFire()) f=1;
 if(nx<0) nx=0; if(ny<0) ny=0; if(nx>=576) nx=576-1; if(ny>=320) ny=320-1;
 if(nx!=penX||ny!=penY){ penX=nx; penY=ny; penShow=1;
  if(penX<docX||penY<docY||penX>=docX+viewW()||penY>=docY+viewH()){
   if(penX<docX) docX=penX; if(penY<docY) docY=penY;
   if(penX>=docX+viewW()) docX=penX-viewW()+1; if(penY>=docY+viewH()) docY=penY-viewH()+1;
   clampScroll(); need=1;
  } else if(joyFire==0&&spaceDown==0) needPen=1;
  if(joyFire||spaceDown) dragDoc(penX,penY);
 }
 if(f&&joyFire==0){ joyFire=1; if(spaceDown==0){ penShow=1; down=1; beginDoc(penX,penY); } }
 else if(f==0&&joyFire){ joyFire=0; if(down&&spaceDown==0) endStroke(penX,penY); }
 else if(f&&joyFire&&spaceDown==0&&tool==5&&(tick%4)==0) spray(penX,penY);
}
function paintResources(){
 var i,sum,n;
 stgWrite(1900,80);stgWrite(1901,65);stgWrite(1902,73);stgWrite(1903,78);stgWrite(1904,84);
 stgWrite(1905,46);stgWrite(1906,82);stgWrite(1907,83);stgWrite(1908,67);stgWrite(1909,0);
 n=fsRead(1900,0,373504,1611);if(n!=1611)return 0;
 if(stgRead(373504)!=74||stgRead(373505)!=77||stgRead(373506)!=82||stgRead(373507)!=80)return 0;
 if(stgRead(373508)!=1||stgRead(373509)!=32||r16(373510)!=95)return 0;
 if(r16(373512)!=1579||r16(373514)!=0)return 0;
 if(r16(373520)!=0||r16(373522)!=475||r16(373524)!=1243||r16(373526)!=1259||r16(373528)!=1563)return 0;
 i=0;sum=0;while(i<1579){sum=sum+stgRead(373536+i);i=i+1;}
 if(sum!=stgRead(373516)+stgRead(373517)*256+stgRead(373518)*65536+stgRead(373519)*16777216)return 0;
 i=0;while(i<16){n=stgRead(374779+i);if(n<1||n>24||stgRead(375099+i)>15)return 0;i=i+1;}
 return 1;
}
function frame(){
 tick=tick+1;
 if(!PC.ready){ctx.fillStyle="#FFF";ctx.fillRect(24,88,576,344);ctx.fillStyle="#000";ctx.fillText("PAINT.RSC missing or invalid",80,120);tbSessionFrame(frame);return;}

 else {

  if(tool==3&&mode==0&&(tick%24)==0) need=1;
  if(selOn&&(tick%12)==0) need=1;
  if(need){ paintAll(); need=0; } else if(needPen){ refreshPen(); needPen=0; }
 }
 tbSessionFrame(frame);
}

// Shared file-name policy, embedded into clients that own Save As.
function tbClientFilename(a,ext,kind){
 var i=0,c,stem=0,n=0,dot=0,j,legal,on;
 if(kind){
  if(ext=="")return 1;while(i<a.length){if(a[i]==46)dot=i+1;i=i+1;}
  if(dot==0)return 0;i=dot;while(i<a.length){if(a[i]!=strByte(ext,i-dot))return 0;i=i+1;}return strByte(ext,i-dot)<0;
 }
 while(i<a.length){
  c=a[i];if(c>=97&&c<=122)c=c-32;a[i]=c;
  if(c==46){if(dot||stem==0)return 0;dot=1;}
  else{
   on=(c>=65&&c<=90)||(c>=48&&c<=57);j=0;
   while(j<17&&!on){legal=strByte("$%'-_@~`!(){}^#&",j);if(c==legal)on=1;j=j+1;}
   if(!on)return 0;if(dot)n=n+1;else stem=stem+1;
  }i=i+1;
 }
 if(stem<1||stem>8||n>3||(dot&&n==0))return 0;
 if(!dot){
  a.push(46);i=0;
  while(i<3){c=strByte(ext,i);if(c<0)break;a.push(c);i=i+1;}
 }
 if(a.length>12)return 0;return 1;
}
tbSessionNames(tbClientFilename);
// END shared filename_client.js

//

//   1900         file name. 1920 is the 8-byte PNT1 header.
//   3600         up to 14 picture names copied out of the fsList.

// full-page clipboard have to fit in the 73728-byte arena. A taller
// classic page does not fit beside those copies. That is a size

// files as the disk has. Open copies the page into the undo buffer

// copies the page back. Open clears Undo. The arena is scratch: it
// is not kept when the program quits, so Disk Save writes the page.

// grey because that command writes SOURCE for the editor and the
// compiler only. Disk Save / Save As / Open use fsWrite and fsRead,

function pollJoy(){

  if(penX<docX||penY<docY||penX>=docX+viewW()||penY>=docY+viewH()){

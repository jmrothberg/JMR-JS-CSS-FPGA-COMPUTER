<!doctype html>
<html lang="en">
<head>
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=6c1558a354">
<meta name="apple-mobile-web-app-title" content="JS Computer">

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101e31">
  <title>JMR JS Computer</title>
  <meta name="description" content="Boot the JMR JS Computer in your browser and explore its original Finder, Toolbox, and programs.">
  <meta property="og:title" content="JMR JS Computer">
  <meta property="og:description" content="Open the Finder, run a program, and write your own on the shared JMR JS Computer disk.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="__SITE_ORIGIN__/">
  <meta property="og:image" content="__SITE_ORIGIN__/social.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="JMR JS Computer with the Finder desktop open">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="./icon.webp" type="image/webp">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main class="computer">
    <header class="masthead">
      <div>
        <h1>JMR JS Computer</h1>
        <p>Explore the Finder, run a program, or write your own.</p>
      </div>
      <a href="https://github.com/jmrothberg/JMR-JS-CSS-FPGA-COMPUTER">Source on GitHub ↗</a>
    </header>
    <section class="console" aria-label="JMR computer">
      <div class="console-bar">
        <span class="disk-label"><i aria-hidden="true"></i><span id="disk-name">Build __BUILD__</span></span>
        <div class="controls">
          <button id="keyboard-button" type="button" aria-controls="keyboard" aria-expanded="true">Hide keyboard</button>
          <button id="audio-button" type="button" disabled aria-pressed="false">Sound off</button>
          <button id="screen-button" type="button">Full screen</button>
          <button id="disk-button" type="button" aria-expanded="false" disabled>Disk ▾</button>
        </div>
        <div id="disk-menu" class="disk-menu" hidden>
          <button id="open-button" type="button">Open disk image</button>
          <button id="download-button" type="button">Download current disk</button>
          <button id="reset-button" type="button">Reset to original disk</button>
        </div>
        <input id="open-file" type="file" accept=".img,application/octet-stream" hidden>
      </div>
      <div class="display" id="display">
        <canvas id="screen" width="640" height="480" tabindex="0" aria-label="JMR Finder screen. Click to give the computer keyboard focus."></canvas>
        <div class="startup" id="startup">
          <span class="spinner" aria-hidden="true"></span>
          <p id="startup-message">Loading the computer…</p>
          <button type="button" id="retry" hidden>Reload computer</button>
        </div>
      </div>
      <div class="input-panel">
        <fieldset class="gamepad" id="gamepad" aria-label="Game controls" disabled>
          <div class="direction-pad">
            <button class="up" type="button" data-key="ArrowUp" aria-label="Up arrow">↑</button>
            <button type="button" data-key="ArrowLeft" aria-label="Left arrow">←</button>
            <button type="button" data-key="ArrowDown" aria-label="Down arrow">↓</button>
            <button type="button" data-key="ArrowRight" aria-label="Right arrow">→</button>
          </div>
          <div class="game-actions">
            <button type="button" data-key=" " aria-label="Game Space">Space</button>
            <button type="button" data-key="Enter" aria-label="Game Enter">Enter</button>
          </div>
        </fieldset>
        <fieldset class="keyboard" id="keyboard" aria-label="On-screen keyboard" disabled></fieldset>
      </div>
      <footer class="status-bar">
        <span id="status" role="status">Opening the build __BUILD__ disk</span>
        <span id="rate" title="Program frames advanced per second">—</span>
      </footer>
    </section>
    <p class="hint">Tap the on-screen keys or click the screen to use your keyboard. To move your work to a board, choose <strong>Disk → Download current disk</strong>.</p>
  </main>
  <noscript>This computer uses JavaScript and WebAssembly. Enable JavaScript to start it.</noscript>
</body>
</html>

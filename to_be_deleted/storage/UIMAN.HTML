<!doctype html>
<!-- jmr-toolbox: resident-v2 -->
<html><head><title>Manual Toolbox UI</title></head><body><canvas width="640" height="480"></canvas><script>
// Manual UI owns one raw RAF and all event forwarding. No tbSession calls.
// Descriptor20000..20063 and glyph21000..21031 are exclusive scratch.
var c=document.querySelector("canvas").getContext("2d");
function codes(s){var a=[],i=0,v;while(i<100){v=strByte(s,i);if(v<0)break;a.push(v);i=i+1;}return a;}
var title=codes("Manual Toolbox UI"),status=codes("Choose a Demo menu item"),held=0,redraw=1,mark=0,enabled=0,kind=0;
var ready=tbUIInit(c,20000,21000,title);
tbWindow(40,48,560,392,title);
tbMenus([[codes("Demo"),[
 [codes("Message"),1,1,0],[codes("Confirm"),2,1,0],
 [codes("Edit name"),3,1,0],[codes("Choose row"),4,1,0],
 [codes("Save choices"),5,1,0],[codes("Replace prompt"),6,1,0],
 [codes("Toggle check"),7,1,0],[codes("Enable action"),8,1,0],
 [codes("Guarded action"),9,0,0]]]]);
function command(n){
 if(n>=1&&n<=6){kind=n;tbDialogOpen(n,codes("Example dialog"),[codes("One"),codes("Two"),codes("Three")],n==3?codes("DEMO"):[]);}
 else if(n==7){mark=1-mark;tbMenuChecked(0,6,mark);status=codes("Check toggled");}
 else if(n==8){enabled=1-enabled;tbMenuEnabled(0,8,enabled);status=codes("Guarded action enabled or disabled");}
 else if(n==9)status=codes("Enabled action ran");
 else if(n==255)status=codes("Close requested; this demo stays open");
 redraw=1;
}
function paint(){
 c.fillStyle="#55CCFF";c.fillRect(0,22,640,458);
 tbBox(60,110,520,90,"#FFF");tbText(status,76,128);
 tbText(title,320-Math.floor(tbTextWidth(title)/2),180);
 tbUIDraw(); // UI always overlays freshly redrawn application content.
}
function frame(){
 var n,r;n=tbMenuCommand();if(n)command(n);r=tbDialogResult();
 if(r){
  if(kind==5)status=codes(r==1?"Save chosen":r==2?"Discard chosen":"Cancelled");
  else if(r!=1)status=codes("Cancelled: no action taken");
  else if(kind==3)status=tbDialogValue();
  else if(kind==4)status=tbDialogSelection()==0?codes("One"):tbDialogSelection()==1?codes("Two"):codes("Three");
  else status=codes("Accepted");
  redraw=1;
 }
 if(tbUIChanged())redraw=1;
 if(redraw){if(ready)paint();else{c.fillStyle="#FFF";c.fillRect(0,0,640,480);c.fillStyle="#000";c.fillText("Toolbox UI resource initialization failed",20,80);}redraw=0;}
 requestAnimationFrame(frame);
}
addEventListener("keydown",function(e){if(tbUIKey(e.keyCode,e.charCode))redraw=1;});
addEventListener("mousedown",function(e){if(e.button==0){held=1;tbUIPointer(e.clientX,e.clientY,held);}});
addEventListener("mousemove",function(e){tbUIPointer(e.clientX,e.clientY,held);});
addEventListener("mouseup",function(e){if(e.button==0){held=0;tbUIPointer(e.clientX,e.clientY,held);}});
requestAnimationFrame(frame);
</script></body></html>
